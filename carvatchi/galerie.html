<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ioan Carvatchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="title.gal">
<div class="aurora" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>

<div class="wrap nav-shell">
  <header class="nav glass">
    <a class="brand" href="index.html" aria-label="Ioan Carvatchi"><img class="logo-img" src="logo.png" alt="Ioan Carvatchi Electricien"></a>
    <nav class="nav-links" aria-label="Menu">
      <a href="index.html" data-t="nav.home"></a>
      <a href="galerie.html" aria-current="page" data-t="nav.gallery"></a>
      <a href="index.html#contact" class="call" data-t="nav.contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="ro">RO</button><button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button></div>
  </header>
</div>

<main class="wrap">
  <div class="page-head">
    <span class="pill"><i></i><span data-t="g.pill"></span></span>
    <h1 data-t="g.t"></h1>
    <p class="lead" data-t="g.p"></p>
  </div>

  <div class="filters glass" role="group">
    <button type="button" data-f="toate" aria-pressed="true" data-t="c.all"></button>
    <button type="button" data-f="rezidential" aria-pressed="false" data-t="c.res"></button>
    <button type="button" data-f="tablouri" aria-pressed="false" data-t="c.tab"></button>
    <button type="button" data-f="iluminat" aria-pressed="false" data-t="c.light"></button>
    <button type="button" data-f="verde" aria-pressed="false" data-t="c.green"></button>
    <button type="button" data-f="comercial" aria-pressed="false" data-t="c.com"></button>
  </div>

  <div class="gallery" id="gallery"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <div class="lb-card glass">
    <div class="shot g1"><div class="orb"></div><span class="tag"></span></div>
    <h3></h3>
    <p class="lb-text"></p>
    <div class="lb-bar">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-glass" type="button" data-prev data-t="lb.prev"></button>
        <button class="btn btn-glass" type="button" data-next data-t="lb.next"></button>
      </div>
      <button class="btn btn-primary" type="button" data-close data-t="lb.close"></button>
    </div>
  </div>
</div>

<footer class="wrap"><img class="foot-logo" src="logo.png" alt=""><br><span data-t="foot"></span></footer>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
