<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ioan Carvatchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="title.home">
<div class="aurora" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>

<div class="wrap nav-shell">
  <header class="nav glass">
    <a class="brand" href="index.html" aria-label="Ioan Carvatchi"><img class="logo-img" src="logo.png" alt="Ioan Carvatchi Electricien"></a>
    <nav class="nav-links" aria-label="Menu">
      <a href="index.html" aria-current="page" data-t="nav.home"></a>
      <a href="galerie.html" data-t="nav.gallery"></a>
      <a href="#contact" class="call" data-t="nav.contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-l="ro">RO</button><button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button></div>
  </header>
</div>

<main class="wrap">
  <div class="banner glass" id="banner" role="region" aria-roledescription="carousel">
    <div class="track">
      <article class="slide s1" aria-roledescription="slide">
        <div class="txt">
          <span class="pill"><i></i><span data-t="s1.pill"></span></span>
          <h1 class="h" data-t="s1.h"></h1>
          <p class="lead" data-t="s1.p"></p>
          <div class="cta"><a class="btn btn-primary" href="#contact" data-i="phone"><span data-t="s1.a"></span></a><a class="btn btn-glass" href="galerie.html"><span data-t="s1.b"></span></a></div>
        </div>
        <svg class="scene" viewBox="0 0 520 380" role="img" aria-label="Tablou electric cu siguranțe automate">
          <defs>
            <g id="br"><rect width="36" height="60" rx="8" fill="#f3f7ff" stroke="#c5d7f7"/><rect x="9" y="10" width="18" height="24" rx="5" fill="#0a7cff"/><rect x="9" y="42" width="18" height="4" rx="2" fill="#b3c4e0"/></g>
            <linearGradient id="glowy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84d"/><stop offset="1" stop-color="#ffb200"/></linearGradient>
          </defs>
          <rect x="110" y="24" width="300" height="332" rx="28" fill="#fff" stroke="#cfe0ff" stroke-width="3"/>
          <rect x="132" y="48" width="256" height="284" rx="18" fill="#eaf1ff"/>
          <g fill="none" stroke="#c5d7f7" stroke-width="6" stroke-linecap="round"><path d="M142 114h236M142 194h236M142 274h236"/></g>
          <use href="#br" x="150" y="62"/><use href="#br" x="192" y="62"/><use href="#br" x="234" y="62"/><use href="#br" x="276" y="62"/><use href="#br" x="318" y="62"/>
          <use href="#br" x="150" y="142"/><use href="#br" x="192" y="142"/><use href="#br" x="234" y="142"/><use href="#br" x="276" y="142"/>
          <use href="#br" x="150" y="222"/><use href="#br" x="192" y="222"/><use href="#br" x="234" y="222"/>
          <rect x="318" y="150" width="46" height="46" rx="12" fill="#25c36b"/><path d="M332 173l8 8 12-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M120 350c-50 10-70 10-92 24M400 350c50 10 80 4 100 24" fill="none" stroke="url(#glowy)" stroke-width="7" stroke-linecap="round"/>
          <g class="fl"><path d="M452 70l-26 46h20l-8 40 38-54h-22z" fill="url(#glowy)"/></g>
          <g class="fl d2"><circle cx="62" cy="110" r="30" fill="rgba(255,255,255,.7)" stroke="#fff"/><path d="M64 94l-12 20h10l-3 16 16-22h-10z" fill="#0a7cff"/></g>
        </svg>
      </article>
      <article class="slide s2" aria-roledescription="slide">
        <div class="txt">
          <span class="pill"><i></i><span data-t="s2.pill"></span></span>
          <h2 class="h" data-t="s2.h"></h2>
          <p class="lead" data-t="s2.p"></p>
          <div class="cta"><a class="btn btn-primary" href="#contact" data-i="bulb"><span data-t="s2.a"></span></a><a class="btn btn-glass" href="galerie.html"><span data-t="s2.b"></span></a></div>
        </div>
        <svg class="scene" viewBox="0 0 520 380" role="img" aria-label="Living cu lămpi suspendate">
          <defs><linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8" stop-opacity=".95"/><stop offset="1" stop-color="#fff2a8" stop-opacity="0"/></linearGradient></defs>
          <rect x="30" y="20" width="460" height="14" rx="7" fill="#fff" stroke="#e3d9a5"/>
          <g class="sway"><path d="M130 34v70" stroke="#4c5a78" stroke-width="3"/><path d="M130 104c-30 0-46 20-50 36h100c-4-16-20-36-50-36z" fill="#fff" stroke="#e3d9a5" stroke-width="3"/><path d="M80 140h100l60 190H20z" fill="url(#cone)"/></g>
          <g class="sway d2"><path d="M260 34v110" stroke="#4c5a78" stroke-width="3"/><path d="M260 144c-34 0-52 22-56 40h112c-4-18-22-40-56-40z" fill="#ffd84d" stroke="#e8b900" stroke-width="3"/><path d="M204 184h112l70 150H134z" fill="url(#cone)"/></g>
          <g class="sway"><path d="M390 34v70" stroke="#4c5a78" stroke-width="3"/><path d="M390 104c-30 0-46 20-50 36h100c-4-16-20-36-50-36z" fill="#fff" stroke="#e3d9a5" stroke-width="3"/><path d="M340 140h100l60 190H280z" fill="url(#cone)"/></g>
          <rect x="60" y="300" width="400" height="60" rx="30" fill="#fff" stroke="#e3d9a5" stroke-width="3"/>
          <rect x="84" y="268" width="150" height="50" rx="22" fill="#d9c9ff"/><rect x="286" y="268" width="150" height="50" rx="22" fill="#b9e6ff"/>
        </svg>
      </article>
      <article class="slide s3" aria-roledescription="slide">
        <div class="txt">
          <span class="pill"><i></i><span data-t="s3.pill"></span></span>
          <h2 class="h" data-t="s3.h"></h2>
          <p class="lead" data-t="s3.p"></p>
          <div class="cta"><a class="btn btn-primary" href="#contact" data-i="sun"><span data-t="s3.a"></span></a><a class="btn btn-glass" href="galerie.html"><span data-t="s3.b"></span></a></div>
        </div>
        <svg class="scene" viewBox="0 0 520 380" role="img" aria-label="Casă cu panouri solare">
          <g class="spin"><circle cx="420" cy="80" r="34" fill="#ffd84d"/><g stroke="#ffc700" stroke-width="6" stroke-linecap="round"><path d="M420 22v14M420 124v14M362 80h14M464 80h14M379 39l10 10M451 111l10 10M379 121l10-10M451 49l10-10"/></g></g>
          <path d="M60 190L230 70l170 120z" fill="#7aa7e8"/>
          <path d="M120 175l54-40h92l54 40-18 14H138z" fill="#1d4a99"/>
          <g stroke="#9cc3ff" stroke-width="2" fill="none"><path d="M150 168l30-22M185 168l30-22M220 168l30-22M255 168l30-22M143 148h140M137 160h160"/></g>
          <rect x="84" y="190" width="292" height="150" rx="10" fill="#fff" stroke="#cfe0ff" stroke-width="3"/>
          <rect x="120" y="226" width="70" height="60" rx="8" fill="#b9e6ff"/><rect x="262" y="226" width="86" height="114" rx="8" fill="#ffe58a"/>
          <rect x="400" y="236" width="56" height="86" rx="14" fill="#fff" stroke="#b4f1d6" stroke-width="4"/>
          <path d="M428 256l-10 18h8l-3 14 14-20h-9z" fill="#1fb877"/>
          <path d="M456 290c20 0 30 10 30 30" fill="none" stroke="#1fb877" stroke-width="5" stroke-linecap="round"/>
          <rect x="20" y="338" width="480" height="14" rx="7" fill="#d6f3e6"/>
        </svg>
      </article>
    </div>
    <button class="arrow prev" type="button" aria-label="Previous">‹</button>
    <button class="arrow next" type="button" aria-label="Next">›</button>
    <div class="dots" role="tablist"></div>
  </div>

  <section id="servicii">
    <div class="sec-head"><h2 data-t="svc.t"></h2><p data-t="svc.p"></p></div>
    <div class="grid">
      <article class="card glass"><div class="tile" data-i="home"></div><h3 data-t="sv.1t"></h3><p data-t="sv.1d"></p></article>
      <article class="card glass"><div class="tile" data-i="panel"></div><h3 data-t="sv.2t"></h3><p data-t="sv.2d"></p></article>
      <article class="card glass"><div class="tile" data-i="bulb"></div><h3 data-t="sv.3t"></h3><p data-t="sv.3d"></p></article>
      <article class="card glass"><div class="tile" data-i="bolt"></div><h3 data-t="sv.4t"></h3><p data-t="sv.4d"></p></article>
      <article class="card glass"><div class="tile" data-i="car"></div><h3 data-t="sv.5t"></h3><p data-t="sv.5d"></p></article>
      <article class="card glass"><div class="tile" data-i="sun"></div><h3 data-t="sv.6t"></h3><p data-t="sv.6d"></p></article>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="contact-card glass">
      <div>
        <h2 data-t="ct.t"></h2>
        <p data-t="ct.p"></p>
        <ul class="contact-list">
          <li><span class="ico-box" data-i="phone"></span><div><small data-t="ct.phone"></small><b>0700 000 000</b></div></li>
          <li><span class="ico-box" data-i="mail"></span><div><small data-t="ct.mail"></small><b>contact@carvatchi.ro</b></div></li>
          <li><span class="ico-box" data-i="pin"></span><div><small data-t="ct.zone"></small><b data-t="ct.zv"></b></div></li>
        </ul>
      </div>
      <form id="cerere" novalidate>
        <div class="row2">
          <label for="nume"><span data-t="f.name"></span><input id="nume" name="nume" autocomplete="name"></label>
          <label for="tel"><span data-t="f.tel"></span><input id="tel" name="tel" type="tel" autocomplete="tel"></label>
        </div>
        <label for="tip"><span data-t="f.type"></span>
          <select id="tip" name="tip"><option data-t="f.o1"></option><option data-t="f.o2"></option><option data-t="f.o3"></option><option data-t="f.o4"></option><option data-t="f.o5"></option><option data-t="f.o6"></option></select>
        </label>
        <label for="msg"><span data-t="f.msg"></span><textarea id="msg" name="msg" data-ph="f.ph"></textarea></label>
        <button class="btn btn-primary" type="submit" data-t="f.send"></button>
        <p class="note" id="ok" role="status" hidden></p>
      </form>
    </div>
  </section>
</main>

<footer class="wrap"><img class="foot-logo" src="logo.png" alt=""><br><span data-t="foot"></span></footer>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
