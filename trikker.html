<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Proiect electric">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2c3e50">
<title>Proiect electric – Unifilar și plan</title>
<style>
:root { --sidebar: 300px; --accent: #2980b9; }
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; height: 100vh; height: 100dvh; background: #333; overflow: hidden; }
#sidebar { width: var(--sidebar); background: #f8f9fa; border-right: 2px solid #000; overflow-y: auto; flex: none; -webkit-overflow-scrolling: touch; }
.nav-tabs { display: flex; background: #2c3e50; }
.tab { flex: 1; padding: 12px 6px; color: #fff; background: none; border: none; cursor: pointer; font-weight: bold; font-size: 12px; }
.tab.active { background: var(--accent); }
.section-header { background: #d1d4d7; padding: 6px 12px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #aaa; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
.btn { background: #fff; border: 1px solid #ccc; padding: 4px 2px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.btn canvas { width: 36px; height: 36px; }
.btn:hover { background: #e8f4fd; }
.btn.active { background: #3498db; color: #fff; border-color: #21618c; }
.btn.danger.active { background: #c0392b; border-color: #7b241c; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#toolbar { background: #fff; display: flex; flex-direction: column; gap: 6px; padding: 6px 12px; border-bottom: 1px solid #000; font-size: 13px; }
#tbmain, #tbmore { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%; }
#tbmore { padding-top: 6px; border-top: 1px solid #ddd; }
#toolbar.compact #tbmore { display: none; }
#tbshow { display: none; position: fixed; top: 6px; right: 10px; z-index: 60; padding: 8px 14px; border-radius: 18px; border: 1px solid #555; background: rgba(255,255,255,.95); box-shadow: 0 2px 6px rgba(0,0,0,.4); font-weight: bold; cursor: pointer; }
body.tbhid #tbshow { display: block; }
body.tbhid #help { display: none; }
body.p2 .p1only { display: none !important; }
#toolbar button { padding: 6px 10px; cursor: pointer; }
#cab, #app { padding: 4px; }
#cid { width: 60px; font-weight: bold; border: 2px solid var(--accent); padding: 4px; }
#st { margin-left: auto; color: var(--accent); font-weight: bold; }
#canvas-wrap { flex: 1; overflow: auto; padding: 30px; background: #666; -webkit-overflow-scrolling: touch; }
#pc { display: none; }
#c { display: block; flex: none; margin: 0 auto; background-color: #fff; border: 1px solid #000; box-shadow: 0 0 20px rgba(0,0,0,.5); cursor: crosshair; touch-action: none;
  background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px); background-size: 20px 20px; }
#c { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#c.pan { touch-action: auto; cursor: grab; }
@media (pointer: coarse) {
  #toolbar button, #toolbar input, #toolbar select { min-height: 40px; font-size: 14px; }
  .btn { padding: 10px 2px; font-size: 12px; }
  .tab { padding: 16px 6px; font-size: 13px; }
  :root { --sidebar: 250px; }
  input, select, textarea { font-size: 16px; }
  #fab { display: flex; }
  #canvas-wrap { padding: 8px; }
  #toolbar { padding: 4px 8px; }
}
@media (max-width: 1000px) { #fab { display: flex; } :root { --sidebar: 230px; } }
#fab { position: fixed; right: 10px; bottom: 46px; display: none; flex-direction: column; gap: 6px; z-index: 50; }
#fab button { width: 48px; height: 48px; font-size: 20px; border-radius: 50%; border: 1px solid #555; background: rgba(255,255,255,.92); box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer; }
#home { position: fixed; inset: 0; background: #f1f2f4; z-index: 80; display: none; flex-direction: column; font-family: 'Segoe UI', Arial, sans-serif; }
#htop { background: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #ddd; }
#htop .htab { border-bottom: 3px solid #5b4fcf; padding: 6px 4px; font-size: 14px; }
#htop button { padding: 7px 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
#htop .vb.on { background: #dfe3e8; }
#hwrap { flex: 1; overflow: auto; }
#hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 20px; max-width: 1100px; margin: 0 auto; }
.pcard { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.18); padding: 14px 10px 12px; cursor: pointer; position: relative; text-align: center; }
.pcard:hover { box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.pcard .th { height: 110px; display: flex; align-items: center; justify-content: center; }
.pcard .th img { max-width: 100%; max-height: 110px; border: 1px solid #eee; }
.pcard .nm { font-weight: 600; margin-top: 8px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .dt { font-size: 11px; color: #888; margin-top: 2px; }
.pcard .dots { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: #1e73d8; color: #fff; border: none; font-size: 16px; cursor: pointer; }
.pcard .big { font-size: 72px; line-height: 110px; font-weight: bold; }
#hgrid.list { grid-template-columns: 1fr; }
#hgrid.list .pcard { display: flex; align-items: center; text-align: left; gap: 14px; padding: 8px 52px 8px 12px; }
#hgrid.list .th { height: 54px; width: 90px; flex: none; }
#hgrid.list .th img { max-height: 54px; }
#hgrid.list .big { font-size: 40px; line-height: 54px; }
#hgrid.list .nm { margin-top: 0; }
#cmenu { position: fixed; z-index: 90; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.3); min-width: 160px; padding: 4px 0; font: 14px 'Segoe UI', Arial, sans-serif; }
#cmenu div { padding: 10px 16px; cursor: pointer; }
#cmenu div:hover { background: #eef4fb; }
#help { padding: 6px 15px; background: #ecf0f1; font-size: 12px; border-top: 1px solid #000; }
#levels { display: none; background: #ecf0f1; padding: 6px 15px; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #000; font-size: 13px; }
#levels .lv { padding: 5px 12px; border: 1px solid #999; background: #fff; cursor: pointer; border-radius: 3px; font-weight: bold; }
#levels .lv.active { background: var(--accent); color: #fff; border-color: #21618c; }
#levels .lvadd { background: #27ae60; color: #fff; border-color: #1e8449; }
#cabbar { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; }
#cabbar select { padding: 3px; }
#cabinfo { color: #555; }
#pa { display: none; }
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99}
.dlg{background:#fff;border-radius:8px;padding:18px 20px;min-width:300px;width:min(520px,94vw);max-width:94vw;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:14px}
.dlg h4{margin:0 0 12px;font-size:15px}
.dlg label{display:block;margin:8px 0}
.dlg input[type=text],.dlg input:not([type]),.dlg select{padding:6px;max-width:100%}
.dlg .qty{display:flex;gap:6px;margin-top:6px}
.dlg .qty button{width:42px;font-size:22px;cursor:pointer}
.dlg .qty input{width:80px;font-size:22px;text-align:center;font-weight:bold}
.dlg .dbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg .dbtn button{padding:9px 18px;cursor:pointer;font-size:15px}
.dlg .dok{background:#27ae60;color:#fff;border:1px solid #1e8449;font-weight:bold}
.dlg small{color:#666;display:block;margin-top:8px}
.dlg .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.dlg .chip{min-width:44px;height:40px;font-size:17px;font-weight:bold;border:1px solid #888;background:#f4f6f8;border-radius:6px;cursor:pointer}
.dlg .chip.on{background:#2980b9;color:#fff;border-color:#1b5e8a}
.dlg .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dlg .full{width:100%;margin-top:4px}
/* ---- Mod tabletă / ecran mic ---- */
#chip { display: none; }
body.small #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 70; width: 230px; box-shadow: 4px 0 14px rgba(0,0,0,.45); }
body.small #help { display: none; }
body.small #chip { display: block; position: fixed; left: 10px; bottom: 10px; z-index: 50; background: rgba(44,62,80,.92); color: #fff; padding: 7px 12px; border-radius: 16px; font-size: 13px; font-weight: bold; max-width: 60vw; pointer-events: none; }
body.small #fab { display: flex; flex-wrap: wrap; max-height: calc(100dvh - 70px); justify-content: flex-end; align-content: flex-end; bottom: 10px; }
body.small #fab button { width: 46px; height: 46px; }
body.small #canvas-wrap { padding: 4px; }
@media print { #chip { display: none !important; } }
@media print {
  body { display: block; height: auto; background: #fff; overflow: visible; }
  #sidebar, #toolbar, #help, #levels, #canvas-wrap, #fab, #home, #tbshow { display: none !important; }
  #main { display: block; }
  #pa { display: block; }
  .pg { break-after: page; page-break-after: always; }
  .pg:last-child { break-after: auto; page-break-after: auto; }
  .pg h3 { font: bold 14px Arial; margin: 0 0 3mm; }
  .pg canvas, .pg img { display: block; width: 100%; height: auto; max-height: 172mm; object-fit: contain; margin: 0 auto; }
  @page { size: landscape; margin: 8mm; }
}

/* ================= Stil iOS (doar pe PC) ================= */

body.pc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; background: #f2f2f7; color: #1c1c1e; -webkit-font-smoothing: antialiased; }

/* meniul din stânga */

body.pc #menu { padding-bottom: 20px; }
body.pc .nav-tabs { background: rgba(118,118,128,.12); margin: 12px 12px 4px; padding: 2px; border-radius: 9px; gap: 2px; }

/* zona de desen */

  background-image: linear-gradient(#f0f0f5 1px, transparent 1px), linear-gradient(90deg, #f0f0f5 1px, transparent 1px); }

/* ===== INTERFAȚĂ iOS PRO – suprascrie aspectul de mai sus ===== */

@media screen {

/* ---------- Variabile de design ---------- */
:root {
  --ios-blue: #007aff;
  --ios-blue-soft: rgba(0,122,255,.12);
  --ios-green: #34c759;
  --ios-red: #ff3b30;
  --ios-bg: #f2f2f7;
  --ios-card: #ffffff;
  --ios-fill: rgba(120,120,128,.12);
  --ios-fill-2: rgba(120,120,128,.2);
  --ios-sep: rgba(60,60,67,.16);
  --ios-label: #1c1c1e;
  --ios-label-2: #6d6d72;
  --ios-glass: rgba(249,249,251,.78);
  --ios-font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', system-ui, sans-serif;
  --ios-ease: cubic-bezier(.2,.8,.2,1);
  --accent: var(--ios-blue);
}

html body {
  font-family: var(--ios-font);
  background: var(--ios-bg);
  color: var(--ios-label);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: -.005em;
}
html body * { scrollbar-width: thin; scrollbar-color: rgba(60,60,67,.28) transparent; }
html body ::-webkit-scrollbar { width: 8px; height: 8px; }
html body ::-webkit-scrollbar-thumb { background: rgba(60,60,67,.25); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }

/* ---------- Meniul din stânga (sidebar) ---------- */
html body #sidebar {
  background: var(--ios-bg);
  border-right: 1px solid var(--ios-sep);
  padding-bottom: env(safe-area-inset-bottom);
}
html body.small #sidebar {
  background: var(--ios-glass);
  -webkit-backdrop-filter: saturate(180%) blur(28px);
  backdrop-filter: saturate(180%) blur(28px);
  box-shadow: 8px 0 40px rgba(0,0,0,.22);
  border-right: 1px solid var(--ios-sep);
  border-radius: 0 20px 20px 0;
}
html body #menu { padding-bottom: 28px; }

/* Tab-urile = segmented control iOS */
html body .nav-tabs {
  position: sticky; top: 0; z-index: 5;
  background: var(--ios-fill);
  margin: 12px 12px 6px; padding: 2px; gap: 2px;
  border-radius: 10px;
}
html body .tab {
  background: transparent; color: var(--ios-label);
  border-radius: 8px; padding: 8px 4px;
  font: 600 12px var(--ios-font); letter-spacing: -.01em;
  transition: background .25s var(--ios-ease), box-shadow .25s var(--ios-ease), transform .12s;
}
html body .tab:active { transform: scale(.97); }
html body .tab.active {
  background: #fff; color: var(--ios-label);
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.08);
}

/* Titluri de secțiune */
html body .section-header {
  background: transparent; border: none;
  color: var(--ios-label-2);
  font: 600 11.5px var(--ios-font);
  text-transform: uppercase; letter-spacing: .6px;
  padding: 18px 20px 7px;
}

/* Cartonașele cu unelte = grupuri inset iOS */
html body .grid {
  background: var(--ios-card);
  margin: 0 12px; padding: 8px; gap: 6px;
  border-radius: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(60,60,67,.08);
}
html body .btn {
  background: transparent; border: none; border-radius: 12px;
  color: #3a3a3c; font: 500 10.5px var(--ios-font);
  padding: 8px 2px 6px; gap: 3px; line-height: 1.15;
  text-align: center;
  transition: background .18s var(--ios-ease), transform .12s var(--ios-ease), box-shadow .2s;
}
html body .btn canvas { width: 38px; height: 38px; transition: transform .2s var(--ios-ease); }
html body .btn:hover { background: var(--ios-fill); }
html body .btn:hover canvas { transform: scale(1.06); }
html body .btn:active { transform: scale(.93); background: var(--ios-fill-2); }
html body .btn.active {
  background: var(--ios-blue-soft); color: var(--ios-blue);
  box-shadow: inset 0 0 0 1.5px rgba(0,122,255,.55);
  font-weight: 600;
}
html body .btn.danger.active {
  background: rgba(255,59,48,.12); color: var(--ios-red);
  box-shadow: inset 0 0 0 1.5px rgba(255,59,48,.55);
}

/* ---------- Bara de sus (toolbar) ---------- */
html body #toolbar {
  background: var(--ios-glass);
  -webkit-backdrop-filter: saturate(180%) blur(28px);
  backdrop-filter: saturate(180%) blur(28px);
  border-bottom: 1px solid var(--ios-sep);
  padding: 8px 14px; gap: 8px;
  font: 500 13px var(--ios-font);
  position: relative; z-index: 20;
}
html body #tbmore { border-top: 1px solid var(--ios-sep); padding-top: 8px; }
html body #toolbar b { font-weight: 600; color: var(--ios-label-2); font-size: 12px; }
html body #pcur { color: var(--ios-label); font-size: 14px; font-weight: 700; letter-spacing: -.02em; }

/* Butoane de bară = pastile „tinted” iOS */
html body #toolbar button {
  font: 600 13px var(--ios-font);
  background: var(--ios-fill); color: var(--ios-blue);
  border: none; border-radius: 11px;
  padding: 7px 13px; min-height: 34px;

<script>
const cv = document.getElementById('c'), ct = cv.getContext('2d');
const G = 10;                                   // pasul de aliniere (px)
let plans = [{ name:'Parter', items:[] }], lvl = 0;   // planul casei: mai multe niveluri
const pages = { 1: [] };                        // pagina 1 = unifilar; pagina 2 = nivelul curent din plan
Object.defineProperty(pages, 2, { get: () => plans[lvl].items, set: v => { plans[lvl].items = v; }, enumerable: false });
const ALLP = () => plans.flatMap(p => p.items);
let U = {}, linkFrom = null, resizing = null;
let gc = {};                                    // grupuri diferențiale (etaje din tablou): { D1:{app:'2P - 40A|Δ30mA - tip A|LEGRAND'} }; circuitul își ține grupul în circCfg[id].grp
let circCfg = {};                                // per circuit: { A:{cab:'VOB 3G2,5', pl:'incastrat', app:'3kA|2P - C 16A|LEGRAND'} }
let cabPlace = '';                               // pozarea cablului (pagina 1): '', subteran, aerian, incastrat, perete
const PLACE = [['','Nedeterminat'],['subteran','Subteran'],['aerian','Aerian'],['incastrat','Încastrat în perete'],['perete','Pe perete']];
const PLN = { subteran:'subteran', aerian:'aerian', incastrat:'încastrat în perete', perete:'pe perete' };
let TB = [], noRec = false, drag = null, hoverRec = null;     // casete de text (pentru „Mută text”)
let startOpts = { brk:true, meter:true, sect:false, diff:true };   // ce conține lanțul de intrare
let currentPage = 1, md = 'u_wire', rot = 0, start = null, mouse = null;
const isCoarse = () => { try { return matchMedia('(pointer: coarse)').matches; } catch (_) { return false; } };

/* ---------- Unelte ---------- */
// type 'line' = se desenează cu tragere; 'sym' = un clic plasează simbolul
const TOOLS = {
  1: [
    ['NAVIGARE', [ ['nav','☝ Navigare','nav'] ]],
    ['TEXT', [ ['text','Text','sym'], ['move','Mută text','move'], ['edit','Editează','edit'], ['erase','Șterge','erase'] ]],
    ['INTRARE ȘI PROTECȚIE', [
      ['u_start','Branșament complet','sym'], ['u_earth','Împământare','sym'], ['u_ground','Priză pământ','sym'], ['u_feed','Branșament','line'],
      ['u_meter','Contor kWh','sym'], ['u_sect','Separator','sym'], ['u_diff_g','Dif. general','sym'], ['u_bus','Bară cupru','line'], ['u_wire','Cablu','line'] ]],
    ['CIRCUITE (A, B, C...)', [
      ['u_mcb','Disjunctor','sym'], ['u_lamp','Plecare bec','sym'], ['u_sock','Plecare priză','sym'], ['u_vov','Plecare motor','sym'] ]],
    ['PE RÂND (simboluri unifilar)', [
      ['u_x','Bec (X)','sym'], ['e_sock','Priză','sym'], ['e_sw','Întrerup.','sym'], ['e_sw2','Într. dublu','sym'], ['e_swvv','Vai-vien','sym'], ['e_swx','Cruce','sym'] ]]
  ],
  2: [
    ['NAVIGARE', [ ['nav','☝ Navigare','nav'] ]],
    ['CIRCUITE (LEGĂTURI)', [ ['link','Leagă / Circuit','link'], ['edit','Editează','edit'] ]],
    ['STRUCTURĂ', [
      ['wall','Perete','line'], ['room','Cameră','room'], ['door','Ușă','sym'], ['window','Fereastră','sym'],
      ['stair','Scară dreaptă','sym'], ['stair_r','Scară rotundă','sym'], ['resize','Redimensionează','resize'] ]],
    ['ILUMINAT', [
      ['lp_x','Lampă','sym'], ['lp_spot','Spot','sym'], ['lp_neon','Neon','sym'], ['fan','Ventilator','sym'] ]],
    ['PRIZE ȘI COMUTARE', [
      ['sk_1','Priză','sym'], ['sk_2','Priză dublă','sym'], ['sk_ip','Priză IP44','sym'], ['sk_3','Priză trifazată','sym'],
      ['sw_1','Întrerup.','sym'], ['sw_2','Întrerup. dublu','sym'], ['sw_b','Bipolar','sym'], ['sw_c','Vai-vien','sym'], ['sw_x','Cruce','sym'] ]],
    ['ALTELE', [
      ['panel','Tablou','sym'], ['jb','Doză','sym'], ['motor','Motor','sym'], ['text','Text','sym'], ['move','Mută text','move'], ['erase','Șterge','erase'] ]]
  ]
};
const kindOf = k => { for (const p of [1,2]) for (const s of TOOLS[p]) for (const t of s[1]) if (t[0]===k) return t[2]; };
const nameOf = k => { for (const p of [1,2]) for (const s of TOOLS[p]) for (const t of s[1]) if (t[0]===k) return t[1]; };

/* ---------- Simboluri (desenate în jurul lui 0,0) ---------- */
const S = {
  u_meter: c => { c.strokeRect(-20,-15,40,30); c.fillText('kWh',-12,4); },
  u_diff_g: (c, it) => brk(c, it && it.L),
  u_earth: c => { c.beginPath(); c.moveTo(0,0); c.lineTo(10,0); c.moveTo(0,-10); c.lineTo(0,10); c.moveTo(-5,-7); c.lineTo(-5,7); c.moveTo(-10,-4); c.lineTo(-10,4); c.stroke(); },
  u_start: c => {},
  u_ground: c => {                   // priză de pământ: din bară în jos, 2 condensatoare, pământ (0,0 = punctul de pe bară)
    c.beginPath();
    c.moveTo(0,0); c.lineTo(0,20); c.moveTo(-14,20); c.lineTo(14,20); c.moveTo(-14,26); c.lineTo(14,26);
    c.moveTo(0,26); c.lineTo(0,60); c.moveTo(-14,60); c.lineTo(14,60); c.moveTo(-14,66); c.lineTo(14,66);
    c.moveTo(0,66); c.lineTo(0,100); c.moveTo(-14,100); c.lineTo(14,100); c.moveTo(-9,106); c.lineTo(9,106); c.moveTo(-4,112); c.lineTo(4,112);
    c.stroke();
  },
  u_mcb: (c, it) => brk(c, it && it.L),
  u_sect: c => { vline(c,0,10); c.beginPath(); c.moveTo(0,10); c.lineTo(10,24); c.moveTo(-6,24); c.lineTo(6,24); c.moveTo(0,24); c.lineTo(0,40); c.stroke(); },   // separator (sectioner)
  // simboluri pe rând de unifilar: se desenează pe linia orizontală, originea = punctul de pe linie
    e_sock:   (c, it) => { const n = (it && it.n) || 1; for (let i = 0; i < n; i++) sockArc(c, 10 + 15*i); },
    e_sockm:  (c, it) => { const n = (it && it.n) || 1; c.beginPath(); c.moveTo(0, 0); c.lineTo(15*(n-1), 0); c.stroke();

function findChainWire(p) {

    if (w.t === 'line' && w.k === 'u_wire' && w.y1 === w.y2 && Math.abs(p.y - w.y1) <= 10 && p.x >= Math.min(w.x1,w.x2) && p.x <= Math.max(w.x1,w.x2)) return w; }

function findBus(p) {                       // bara orizontală (principală sau sub-bară) cea mai apropiată, la max. 45 px
  let best = null, bd = 45;
  pages[1].forEach(w => { if (w.t === 'line' && w.k === 'u_bus' && Math.abs(w.y1 - w.y2) < 2) {
    const lo = Math.min(w.x1,w.x2), hi = Math.max(w.x1,w.x2), d = Math.abs(p.y - w.y1);

}

  if (it.k === 'u_diff_g') {                  // sub-bara nouă nu trebuie să se suprapună peste altă sub-bară de la același nivel (ex. D2)
    const sy = by - 130;

        Math.max(o.x1, o.x2) >= x - 15 && Math.min(o.x1, o.x2) <= x + 275);
      if (!hit.length) break;
      x = Math.round((Math.max(...hit.map(o => Math.max(o.x1, o.x2))) + 80) / 5) * 5; moved = true;
    }

function capture(xa, xb) {                       // decupează desenul curent și îl redesenează la rezoluție mare (pentru PDF clar)

  const sc = document.createElement('canvas'); sc.width = sw; sc.height = sh;
  const sx = sc.getContext('2d', { willReadFrequently: true }); sx.drawImage(cv, 0, 0, sw, sh);
  const d = sx.getImageData(0,0,sw,sh).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  const xs = Math.floor((xa || 0)/S), xe = Math.min(Math.ceil((xb || W)/S), sw);
  for (let y = 0; y < sh; y++) for (let x = xs; x < xe; x++) if (d[(y*sw+x)*4+3] > 0) { if (x*S<x0) x0=x*S; if ((x+1)*S>x1) x1=(x+1)*S; if (y*S<y0) y0=y*S; if ((y+1)*S>y1) y1=(y+1)*S; }
  if (x1 < 0) return null;
  const m = 20; x0 = Math.max(xa || 0, x0-m); y0 = Math.max(0,y0-m); x1 = Math.min(xb || W, W, x1+m); y1 = Math.min(H,y1+m);

const MAXW = 2200, MAXH = 1250;
const lw = x1-x0, lh = y1-y0;

  c.save(); c.scale(K,K); c.translate(-x0,-y0); c.beginPath(); c.rect(x0,y0,lw,lh); c.clip();
  const isSt = it => it.t === 'sym' && STAIRS.includes(it.k), L = pages[currentPage];
  noRec = true;
  L.filter(isSt).forEach(it => drawItem(c, it));
  L.filter(it => !isSt(it)).forEach(it => drawItem(c, it));
  noRec = false; c.restore();
  pc.lw = lw; pc.lh = lh;                          // mărimea „logică” (fără multiplicator), folosită la scalare
  return pc;
}

  L.push('4P - 25A');
  document.getElementById('apps').innerHTML = L.map(v => '<option value="' + v + '">').join('');
})();
</script>
