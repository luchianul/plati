<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Proiect electric – Unifilar și plan</title>
<style>
:root { --sidebar: 300px; --accent: #2980b9; }
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; height: 100vh; height: 100dvh; background: #333; overflow: hidden; }
#sidebar { width: var(--sidebar); background: #f8f9fa; border-right: 2px solid #000; overflow-y: auto; flex: none; -webkit-overflow-scrolling: touch; }
.nav-tabs { display: flex; background: #2c3e50; }
.tab { flex: 1; padding: 12px 6px; color: #fff; background: none; border: none; cursor: pointer; font-weight: bold; font-size: 12px; }
.tab.active { background: var(--accent); }
.section-header { background: #d1d4d7; padding: 6px 12px; font-size: 12px; font-weight: bold; border-bottom: 1px solid #aaa; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
.btn { background: #fff; border: 1px solid #ccc; padding: 4px 2px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.btn canvas { width: 36px; height: 36px; }
.btn:hover { background: #e8f4fd; }
.btn.active { background: #3498db; color: #fff; border-color: #21618c; }
.btn.danger.active { background: #c0392b; border-color: #7b241c; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#toolbar { background: #fff; display: flex; flex-direction: column; gap: 6px; padding: 6px 12px; border-bottom: 1px solid #000; font-size: 13px; }
#tbmain, #tbmore { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%; }
#tbmore { padding-top: 6px; border-top: 1px solid #ddd; }
#toolbar.compact #tbmore { display: none; }
#tbshow { display: none; position: fixed; top: 6px; right: 10px; z-index: 60; padding: 8px 14px; border-radius: 18px; border: 1px solid #555; background: rgba(255,255,255,.95); box-shadow: 0 2px 6px rgba(0,0,0,.4); font-weight: bold; cursor: pointer; }
body.tbhid #tbshow { display: block; }
body.tbhid #help { display: none; }
body.p2 .p1only { display: none !important; }
#toolbar button { padding: 6px 10px; cursor: pointer; }
#cab, #app { padding: 4px; }
#cid { width: 60px; font-weight: bold; border: 2px solid var(--accent); padding: 4px; }
#st { margin-left: auto; color: var(--accent); font-weight: bold; }
#canvas-wrap { flex: 1; overflow: auto; padding: 30px; background: #666; -webkit-overflow-scrolling: touch; }
#pc { display: none; }
#c { display: block; flex: none; margin: 0 auto; background-color: #fff; border: 1px solid #000; box-shadow: 0 0 20px rgba(0,0,0,.5); cursor: crosshair; touch-action: none;
  background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px); background-size: 20px 20px; }
#c { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#c.pan { touch-action: auto; cursor: grab; }
@media (pointer: coarse) {
  #toolbar button, #toolbar input, #toolbar select { min-height: 40px; font-size: 14px; }
  .btn { padding: 10px 2px; font-size: 12px; }
  .tab { padding: 16px 6px; font-size: 13px; }
  :root { --sidebar: 250px; }
  input, select, textarea { font-size: 16px; }
  #fab { display: flex; }
  #canvas-wrap { padding: 8px; }
  #toolbar { padding: 4px 8px; }
}
@media (max-width: 1000px) { #fab { display: flex; } :root { --sidebar: 230px; } }
#fab { position: fixed; right: 10px; bottom: 46px; display: none; flex-direction: column; gap: 6px; z-index: 50; }
#fab button { width: 48px; height: 48px; font-size: 20px; border-radius: 50%; border: 1px solid #555; background: rgba(255,255,255,.92); box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer; }
#home { position: fixed; inset: 0; background: #f1f2f4; z-index: 80; display: none; flex-direction: column; font-family: 'Segoe UI', Arial, sans-serif; }
#htop { background: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #ddd; }
#htop .htab { border-bottom: 3px solid #5b4fcf; padding: 6px 4px; font-size: 14px; }
#htop button { padding: 7px 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
#htop .vb.on { background: #dfe3e8; }
#hwrap { flex: 1; overflow: auto; }
#hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 20px; max-width: 1100px; margin: 0 auto; }
.pcard { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.18); padding: 14px 10px 12px; cursor: pointer; position: relative; text-align: center; }
.pcard:hover { box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.pcard .th { height: 110px; display: flex; align-items: center; justify-content: center; }
.pcard .th img { max-width: 100%; max-height: 110px; border: 1px solid #eee; }
.pcard .nm { font-weight: 600; margin-top: 8px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .dt { font-size: 11px; color: #888; margin-top: 2px; }
.pcard .dots { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: #1e73d8; color: #fff; border: none; font-size: 16px; cursor: pointer; }
.pcard .big { font-size: 72px; line-height: 110px; font-weight: bold; }
#hgrid.list { grid-template-columns: 1fr; }
#hgrid.list .pcard { display: flex; align-items: center; text-align: left; gap: 14px; padding: 8px 52px 8px 12px; }
#hgrid.list .th { height: 54px; width: 90px; flex: none; }
#hgrid.list .th img { max-height: 54px; }
#hgrid.list .big { font-size: 40px; line-height: 54px; }
#hgrid.list .nm { margin-top: 0; }
#cmenu { position: fixed; z-index: 90; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.3); min-width: 160px; padding: 4px 0; font: 14px 'Segoe UI', Arial, sans-serif; }
#cmenu div { padding: 10px 16px; cursor: pointer; }
#cmenu div:hover { background: #eef4fb; }
#help { padding: 6px 15px; background: #ecf0f1; font-size: 12px; border-top: 1px solid #000; }
#levels { display: none; background: #ecf0f1; padding: 6px 15px; gap: 6px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #000; font-size: 13px; }
#levels .lv { padding: 5px 12px; border: 1px solid #999; background: #fff; cursor: pointer; border-radius: 3px; font-weight: bold; }
#levels .lv.active { background: var(--accent); color: #fff; border-color: #21618c; }
#levels .lvadd { background: #27ae60; color: #fff; border-color: #1e8449; }
#cabbar { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; }
#cabbar select { padding: 3px; }
#cabinfo { color: #555; }
#pa { display: none; }
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99}
.dlg{background:#fff;border-radius:8px;padding:18px 20px;min-width:300px;width:min(520px,94vw);max-width:94vw;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:14px}
.dlg h4{margin:0 0 12px;font-size:15px}
.dlg label{display:block;margin:8px 0}
.dlg input[type=text],.dlg input:not([type]),.dlg select{padding:6px;max-width:100%}
.dlg .qty{display:flex;gap:6px;margin-top:6px}
.dlg .qty button{width:42px;font-size:22px;cursor:pointer}
.dlg .qty input{width:80px;font-size:22px;text-align:center;font-weight:bold}
.dlg .dbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg .dbtn button{padding:9px 18px;cursor:pointer;font-size:15px}
.dlg .dok{background:#27ae60;color:#fff;border:1px solid #1e8449;font-weight:bold}
.dlg small{color:#666;display:block;margin-top:8px}
.dlg .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.dlg .chip{min-width:44px;height:40px;font-size:17px;font-weight:bold;border:1px solid #888;background:#f4f6f8;border-radius:6px;cursor:pointer}
.dlg .chip.on{background:#2980b9;color:#fff;border-color:#1b5e8a}
.dlg .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dlg .full{width:100%;margin-top:4px}
/* ---- Mod tabletă / ecran mic ---- */
#chip { display: none; }
body.small #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 70; width: 230px; box-shadow: 4px 0 14px rgba(0,0,0,.45); }
body.small #help { display: none; }
body.small #chip { display: block; position: fixed; left: 10px; bottom: 10px; z-index: 50; background: rgba(44,62,80,.92); color: #fff; padding: 7px 12px; border-radius: 16px; font-size: 13px; font-weight: bold; max-width: 60vw; pointer-events: none; }
body.small #fab { display: flex; flex-wrap: wrap; max-height: calc(100dvh - 70px); justify-content: flex-end; align-content: flex-end; bottom: 10px; }
body.small #fab button { width: 46px; height: 46px; }
body.small #canvas-wrap { padding: 4px; }
@media print { #chip { display: none !important; } }
@media print {
  body { display: block; height: auto; background: #fff; overflow: visible; }
  #sidebar, #toolbar, #help, #levels, #canvas-wrap, #fab, #home, #tbshow { display: none !important; }
  #main { display: block; }
  #pa { display: block; }
  .pg { break-after: page; page-break-after: always; }
  .pg:last-child { break-after: auto; page-break-after: auto; }
  .pg h3 { font: bold 14px Arial; margin: 0 0 3mm; }
  .pg canvas, .pg img { display: block; width: 100%; height: auto; max-height: 172mm; object-fit: contain; margin: 0 auto; }
  @page { size: landscape; margin: 8mm; }
}

/* ================= Stil iOS (doar pe PC) ================= */
@media screen {
body.pc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; background: #f2f2f7; color: #1c1c1e; -webkit-font-smoothing: antialiased; }
body.pc * { scrollbar-width: thin; scrollbar-color: rgba(60,60,67,.3) transparent; }

/* meniul din stânga */

body.pc #menu { padding-bottom: 20px; }
body.pc .nav-tabs { background: rgba(118,118,128,.12); margin: 12px 12px 4px; padding: 2px; border-radius: 9px; gap: 2px; }

/* bara de sus */
body.pc #toolbar { background: rgba(255,255,255,.82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(60,60,67,.14); padding: 8px 14px; gap: 8px; }
body.pc #tbmore { border-top: 1px solid rgba(60,60,67,.1); }
body.pc #toolbar b { font-weight: 600; color: #3a3a3c; }
body.pc #toolbar button { background: rgba(120,120,128,.12); border: none; border-radius: 9px; color: #007aff; font-weight: 500; padding: 7px 12px; transition: background .12s, transform .08s; }

body.pc #toolbar button[onclick="generate()"] { background: #34c759 !important; color: #fff !important; font-weight: 600; }
body.pc #toolbar button[onclick="showHome()"] { background: #007aff !important; color: #fff !important; font-weight: 600; }
body.pc #toolbar button[onclick="clearAll()"] { color: #ff3b30 !important; }
body.pc #toolbar input:not([type=checkbox]), body.pc #toolbar select { background: rgba(120,120,128,.12); border: none; border-radius: 8px; padding: 6px 10px; color: #1c1c1e; }

body.pc #cid { width: 56px; text-align: center; font-weight: 700; color: #007aff; border: none; }
body.pc #st { color: #007aff; background: rgba(0,122,255,.1); padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
body.pc #st:empty { display: none; }

/* zona de desen */
body.pc #canvas-wrap { background: #e5e5ea; padding: 28px; }
body.pc #c { border: none; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.12);
  background-image: linear-gradient(#f0f0f5 1px, transparent 1px), linear-gradient(90deg, #f0f0f5 1px, transparent 1px); }
body.pc #levels { background: rgba(255,255,255,.82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(60,60,67,.14); padding: 8px 14px; gap: 8px; }
body.pc #levels .lv { background: rgba(120,120,128,.12); border: none; border-radius: 999px; color: #007aff; font-weight: 600; padding: 6px 14px; }
body.pc #levels .lvadd { background: rgba(52,199,89,.15); color: #248a3d; }
body.pc #levels .lv.active { background: #007aff; color: #fff; }
body.pc #help { background: rgba(255,255,255,.82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid rgba(60,60,67,.14); color: #6d6d72; padding: 8px 16px; }

/* ferestre */
body.pc #ov { background: rgba(0,0,0,.3); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
body.pc .dlg { border-radius: 18px; padding: 22px 22px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
body.pc .dlg h4 { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 14px; }
body.pc .dlg input:not([type=checkbox]):not([type=file]), body.pc .dlg select, body.pc .dlg textarea { background: rgba(120,120,128,.12); border: none; border-radius: 9px; padding: 8px 10px; }

/* ===== INTERFAȚĂ iOS PRO – suprascrie aspectul de mai sus ===== */

@media screen {

/* ---------- Variabile de design ---------- */
:root {
  --ios-blue: #007aff;
  --ios-blue-soft: rgba(0,122,255,.12);
  --ios-green: #34c759;
  --ios-red: #ff3b30;
  --ios-bg: #f2f2f7;
  --ios-card: #ffffff;
  --ios-fill: rgba(120,120,128,.12);
  --ios-fill-2: rgba(120,120,128,.2);
  --ios-sep: rgba(60,60,67,.16);
  --ios-label: #1c1c1e;
  --ios-label-2: #6d6d72;
  --ios-glass: rgba(249,249,251,.78);
  --ios-font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', system-ui, sans-serif;
  --ios-ease: cubic-bezier(.2,.8,.2,1);
  --accent: var(--ios-blue);
}

html body {
  font-family: var(--ios-font);
  background: var(--ios-bg);
  color: var(--ios-label);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: -.005em;
}
html body * { scrollbar-width: thin; scrollbar-color: rgba(60,60,67,.28) transparent; }
html body ::-webkit-scrollbar { width: 8px; height: 8px; }
html body ::-webkit-scrollbar-thumb { background: rgba(60,60,67,.25); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }

/* ---------- Meniul din stânga (sidebar) ---------- */
html body #sidebar {
  background: var(--ios-bg);
  border-right: 1px solid var(--ios-sep);
  padding-bottom: env(safe-area-inset-bottom);
}
html body.small #sidebar {
  background: var(--ios-glass);
  -webkit-backdrop-filter: saturate(180%) blur(28px);
  backdrop-filter: saturate(180%) blur(28px);
  box-shadow: 8px 0 40px rgba(0,0,0,.22);
  border-right: 1px solid var(--ios-sep);
  border-radius: 0 20px 20px 0;
}
html body #menu { padding-bottom: 28px; }

/* Tab-urile = segmented control iOS */
html body .nav-tabs {
  position: sticky; top: 0; z-index: 5;
  background: var(--ios-fill);
  margin: 12px 12px 6px; padding: 2px; gap: 2px;
  border-radius: 10px;
}
html body .tab {
  background: transparent; color: var(--ios-label);
  border-radius: 8px; padding: 8px 4px;
  font: 600 12px var(--ios-font); letter-spacing: -.01em;
  transition: background .25s var(--ios-ease), box-shadow .25s var(--ios-ease), transform .12s;
}
html body .tab:active { transform: scale(.97); }
html body .tab.active {
  background: #fff; color: var(--ios-label);
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.08);
}

/* Titluri de secțiune */
html body .section-header {
  background: transparent; border: none;
  color: var(--ios-label-2);
  font: 600 11.5px var(--ios-font);
  text-transform: uppercase; letter-spacing: .6px;
  padding: 18px 20px 7px;
}

/* Cartonașele cu unelte = grupuri inset iOS */
html body .grid {
  background: var(--ios-card);
  margin: 0 12px; padding: 8px; gap: 6px;
  border-radius: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 .5px rgba(60,60,67,.08);
}
html body .btn {
  background: transparent; border: none; border-radius: 12px;
  color: #3a3a3c; font: 500 10.5px var(--ios-font);
  padding: 8px 2px 6px; gap: 3px; line-height: 1.15;
  text-align: center;
  transition: background .18s var(--ios-ease), transform .12s var(--ios-ease), box-shadow .2s;
}
html body .btn canvas { width: 38px; height: 38px; transition: transform .2s var(--ios-ease); }
html body .btn:hover { background: var(--ios-fill); }
html body .btn:hover canvas { transform: scale(1.06); }
html body .btn:active { transform: scale(.93); background: var(--ios-fill-2); }
html body .btn.active {
  background: var(--ios-blue-soft); color: var(--ios-blue);
  box-shadow: inset 0 0 0 1.5px rgba(0,122,255,.55);
  font-weight: 600;
}
html body .btn.danger.active {
  background: rgba(255,59,48,.12); color: var(--ios-red);
  box-shadow: inset 0 0 0 1.5px rgba(255,59,48,.55);
}

/* ---------- Bara de sus (toolbar) ---------- */
html body #toolbar {
  background: var(--ios-glass);
  -webkit-backdrop-filter: saturate(180%) blur(28px);
  backdrop-filter: saturate(180%) blur(28px);
  border-bottom: 1px solid var(--ios-sep);
  padding: 8px 14px; gap: 8px;
  font: 500 13px var(--ios-font);
  position: relative; z-index: 20;
}
html body #tbmore { border-top: 1px solid var(--ios-sep); padding-top: 8px; }
html body #toolbar b { font-weight: 600; color: var(--ios-label-2); font-size: 12px; }
html body #pcur { color: var(--ios-label); font-size: 14px; font-weight: 700; letter-spacing: -.02em; }

/* Butoane de bară = pastile „tinted” iOS */
html body #toolbar button {
  font: 600 13px var(--ios-font);
  background: var(--ios-fill); color: var(--ios-blue);
  border: none; border-radius: 11px;
  padding: 7px 13px; min-height: 34px;
  transition: background .15s, transform .1s var(--ios-ease), box-shadow .2s;
}
html body #toolbar button:hover { background: var(--ios-fill-2); }
html body #toolbar button:active { transform: scale(.95); background: var(--ios-fill-2); }

/* Butoane principale (au stil inline, de aceea !important) */
html body #toolbar button[onclick="showHome()"] {
  background: linear-gradient(180deg,#2f8bff,#007aff) !important; color: #fff !important;

/* Legătura cu Google (Apps Script + Sheet) când pagina rulează pe GitHub Pages.
   Imită google.script.run, deci restul aplicației merge neschimbat. */
(function () {
  if (window.google && google.script && google.script.run) return;   // rulează chiar în Apps Script -> nu e nevoie
  var URL = "https://script.google.com/macros/library/d/1m8NwcNWZl--SQIJN2wf5c58k9xhrV6pYFZ403xHNrbJBS3usH7C9pJVN/1";
  function make(ok, err) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === 'withSuccessHandler') return function (f) { return make(f, err); };
      if (fn === 'withFailureHandler') return function (f) { return make(ok, f); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        fetch(URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (j.error) throw new Error(j.error); if (ok) ok(j.result); })
          .catch(function (e) { if (err) err(e); else console.error(e); });
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>

function sockBody(c, fill, st){            // priză: tija pornește din perete, arcul „∪” e spre cameră (ca pe unifilar)
  const b = st + 1;                         // b = poziția peretelui
  c.beginPath(); c.moveTo(0,b-2); c.lineTo(0,b-16); c.stroke();      // tija, din perete până la vârful arcului

}

function style(c, lw=2){ c.strokeStyle = '#000'; c.fillStyle = '#000'; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.font = 'bold 12px Arial'; }

const STAIRS = ['stair','stair_r'];

const insUndo = [];
function findChainWire(p) {
  const L = pages[1];
  for (let i = L.length-1; i >= 0; i--) { const w = L[i];
    if (w.t === 'line' && w.k === 'u_wire' && w.y1 === w.y2 && Math.abs(p.y - w.y1) <= 10 && p.x >= Math.min(w.x1,w.x2) && p.x <= Math.max(w.x1,w.x2)) return w; }
  return null;
}
function insertOnWire(it, p) {              // it = aparatul (deja poziționat pe cablu); returnează true dacă s-a inserat
  const w = findChainWire(p); if (!w) return false;
  const L = pages[1], wy = w.y1, lo = Math.min(w.x1,w.x2), hi = Math.max(w.x1,w.x2);
  const px = it.k === 'u_meter' ? it.x - 20 : it.x, len = 40, d = len + Math.max(0, 60 - (hi - px));
  insUndo.push({ snap: JSON.stringify(L), uid: it.uid });
  L.forEach(o => {
    if (o === w) return;
    if (o.t === 'line') {
      if (o.k === 'u_bus' && Math.abs(o.y1 - (wy-40)) < 2) { if (Math.max(o.x1,o.x2) > px) { if (o.x2 >= o.x1) o.x2 += d; else o.x1 += d; } }
      else if (Math.max(o.y1,o.y2) >= wy-1 && Math.min(o.x1,o.x2) >= px) { o.x1 += d; o.x2 += d; }
    } else if (o.t === 'sym' || o.t === 'text') {
      if (o.k === 'u_ground' && Math.abs(o.y - (wy-40)) < 2) { if (o.x > px) o.x += d; }
      else if (o.y >= wy-1 && o.x >= px) o.x += d;
    }
  });
  const leftLen = px - lo, rest = { t:'line', k:'u_wire', x1:px+len, y1:wy, x2:hi+d, y2:wy, txt: leftLen > 0 ? '' : (w.txt || ''), pl: w.pl };
  if (leftLen > 0) { w.x1 = lo; w.x2 = px; } else L.splice(L.indexOf(w), 1);
  L.push(it); if (hi + d > px + len) L.push(rest);
  return true;
}   // simbolurile pentru care se întreabă „câte bucăți”   // pleacă în sus din bară
const IDSYM = ['lp_x','lp_spot','lp_neon','fan','motor','sk_1','sk_2','sk_ip','sk_3','sw_1','sw_2','sw_b','sw_c','sw_x'];
function ftx(c, tag, it, t, x, y) {      // fillText care își notează caseta (pentru „Mută text”)
  if (!noRec && t) {
    const m = c.getTransform(), w = c.measureText(t).width, h = parseInt((c.font.match(/(\d+)px/) || [0,12])[1]);
    const x0 = c.textAlign === 'center' ? x - w/2 : c.textAlign === 'right' ? x - w : x, y0 = c.textBaseline === 'middle' ? y - h/2 : y - h*0.8;
    const P = [[x0,y0],[x0+w,y0],[x0,y0+h],[x0+w,y0+h]].map(([a,b]) => [m.a*a + m.c*b + m.e, m.b*a + m.d*b + m.f]);
    TB.push({ it, tag, x0:Math.min(...P.map(q => q[0])), x1:Math.max(...P.map(q => q[0])), y0:Math.min(...P.map(q => q[1])), y1:Math.max(...P.map(q => q[1])) });
  }
  c.fillText(t, x, y);
}
const offOf = (it, tag) => (it.off && it.off[tag]) || null;
function plSymbol(c, it) {            // simbol de pozare pe cablu (ca în Trikker): subteran / aerian / încastrat (E) / pe perete (Ǝ)
  const dx = it.x2 - it.x1, dy = it.y2 - it.y1, L = Math.hypot(dx, dy); if (!it.pl || L < 50) return;
  c.save(); style(c, 1.5);
  if (Math.abs(dx) >= Math.abs(dy)) { c.translate(Math.min(it.x1, it.x2), it.y1); c.rotate(Math.PI/2); }   // cablul orizontal: simbolurile apar deasupra
  else c.translate(it.x1, Math.max(it.y1, it.y2));                                                          // cablul vertical: în stânga
  const E = (y, mir) => { const sp = mir ? -4 : -14, ar = mir ? -14 : -5; c.beginPath(); c.moveTo(sp, y-8); c.lineTo(sp, y+8); [-8,0,8].forEach(k => { c.moveTo(sp, y+k); c.lineTo(ar, y+k); }); c.stroke(); };
  if (it.pl === 'incastrat') { E(-15, false); E(-(L-15), false); }
  else if (it.pl === 'perete') { E(-15, true); E(-(L-15), true); }
  else if (it.pl === 'subteran') { c.beginPath(); [-8,-13,-18].forEach(x => { c.moveTo(x,-12); c.lineTo(x,-26); }); c.moveTo(-25,-27); c.lineTo(-22,-11); c.stroke(); }
  else if (it.pl === 'aerian') { c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -(L-17), 5, 0, 7); c.fill(); c.stroke(); }
  c.restore();
}
function lineText(c, it) {
  const mx = (it.x1+it.x2)/2, my = (it.y1+it.y2)/2;
  c.save(); const o = offOf(it, 'txt'); if (o) c.translate(o[0], o[1]);
  c.font = '11px Arial'; c.textAlign = 'center'; c.translate(mx, my);
  const pl = '';
  if (Math.abs(it.x2-it.x1) >= Math.abs(it.y2-it.y1)) {
    ftx(c, 'txt', it, it.txt, 0, -6);
    if (pl) { c.font = 'italic 10px Arial'; ftx(c, 'txt', it, pl, 0, 14); }
  } else {
    c.rotate(Math.PI/2); const sl = it.side === 'l';
    if (pl) { c.font = 'italic 10px Arial'; ftx(c, 'txt', it, pl, 0, sl ? 15 : -6); }          // pozarea lipită de linie
    c.font = '11px Arial'; ftx(c, 'txt', it, it.txt, 0, sl ? (pl ? 27 : 15) : (pl ? -18 : -6));  // apoi cablul
  }

}
function symText(c, it) {
  const L = it.txt.split('|'); c.save(); const o = offOf(it, 'txt'); if (o) c.translate(o[0], o[1]); style(c, 1); c.font = 'bold 11px Arial';
  const horiz = Math.abs(Math.sin(it.a)) > .5;
  if (horiz || it.k === 'u_meter') {
    c.textAlign = 'center';
    const cx = it.k === 'u_meter' ? it.x : it.x + 20*Math.sign(Math.sin(it.a)), y0 = it.y + (it.k === 'u_meter' ? 30 : 24);
    L.forEach((l,i) => fillLine(c, l, cx, y0 + i*12, i, L.length, it));
  } else {
    const y0 = it.y + (Math.cos(it.a) < 0 ? 40 : 0);
    c.translate(it.x, y0); c.rotate(-Math.PI/2);
    L.forEach((l,i) => fillLine(c, l, 4 + (it.to || 0), 14 + (it.tp || 0) + i*12, i, L.length, it));
  }

}
function idLabel(c, it) {          // litera circuitului: în partea dinspre cameră, ca să știi a cui e fiecare priză
    const ux = Math.sin(it.a), uy = -Math.cos(it.a), d = QTY.includes(it.k) ? 38 : (WALLMOUNT[it.k] ? 27 : 24);
  c.save(); const o = offOf(it, 'id'); if (o) c.translate(o[0], o[1]); style(c, 1); c.font = 'bold 13px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';

function qtyLabel(c, it) {         // „x3” lângă simbol
  c.save(); const o = offOf(it, 'q'); if (o) c.translate(o[0], o[1]); style(c, 1); c.font = 'bold 13px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';

  else { x = it.x + Math.cos(it.a)*20 + Math.sin(it.a)*14; y = it.y + Math.sin(it.a)*20 - Math.cos(it.a)*14; }

function groundText(c, it) {        // „??Ω” și data măsurătorii, sub simbolul de pământ
  const L = it.txt.split('|'), co = Math.cos(it.a), si = Math.sin(it.a);

function fillLine(c, l, x, y, i, n, it) {
  c.font = (i >= 2 && i === n-1 ? 'italic ' : '') + 'bold 11px Arial';
  const m = i === 0 && /^(\d+(?:[.,]\d+)?)\s*kA$/i.exec(l);
  if (m) l = String(Math.round(parseFloat(m[1].replace(',', '.')) * 1000));   // 3kA -> 3000
  if (i === 0 && /^\d{3,6}$/.test(l)) {                                          // primul rând = doar număr -> îl încadrăm

function drawItem(c, it) {
  style(c);
  if (it.t === 'link') {
    const a = U[it.from], b = it.to ? U[it.to] : it.pt; if (!a || !b) return;
    c.save(); c.strokeStyle = '#c0392b'; c.lineWidth = 1.2; c.setLineDash([6,4]);
    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke(); c.restore(); return;
  }
  if (it.t === 'group') { it.items.forEach(i => drawItem(c, i)); return; }
  if (it.t === 'line') {
    const thick = it.k === 'wall' ? 7 : it.k === 'u_bus' ? 5 : 2;
    c.lineWidth = thick; c.lineCap = it.k === 'wall' ? 'square' : 'butt';
    c.beginPath(); c.moveTo(it.x1,it.y1); c.lineTo(it.x2,it.y2); c.stroke();
    if (it.k === 'u_feed') {
      const a = Math.atan2(it.y2-it.y1, it.x2-it.x1);
      c.beginPath(); c.moveTo(it.x2,it.y2); c.lineTo(it.x2-12*Math.cos(a-.4), it.y2-12*Math.sin(a-.4)); c.lineTo(it.x2-12*Math.cos(a+.4), it.y2-12*Math.sin(a+.4)); c.closePath(); c.fill();

    c.font = (it.nb ? '' : 'bold ') + (it.sz || 14) + 'px Arial'; ftx(c, 'free', it, it.txt, it.x, it.y);
  } else if (it.t === 'sym') {

    if (it.id) {
      style(c);
      if (IDSYM.includes(it.k)) idLabel(c, it);

  if (d.lib) { Object.keys(d.lib).forEach(id => { if (!lib[id]) { lib[id] = d.lib[id]; regSym(id); } }); libSave(); libTools(); }
  pages[1] = d[1]; pages.del = d.del || []; if (d.so) startOpts = d.so; if (d.cp !== undefined) cabPlace = d.cp; circCfg = d.cc || {};
  if (d.plans && d.plans.length) { plans = d.plans; lvl = Math.min(d.lvl || 0, plans.length - 1); }
  else if (d[2]) plans = [{ name:'Parter', items:d[2] }];
  const all = [pages[1]].concat(plans.map(p => p.items));
  all.forEach(L => L.forEach(it => { if (it.t === 'sym' && !it.uid) it.uid = newUid(); if (it.t === 'sym' && it.a === undefined) it.a = (it.r||0)*Math.PI/2; }));
}
function showProject() { buildMenu(); buildLevels(); setMode(md); redraw(); fillPlace(); }
function readLocal(name) { try { applyData(JSON.parse(lsGet(lsKey(name)))); } catch (_) {} }
function load() {                          // la pornire
  try { projList = JSON.parse(lsGet('proiecte_lista')) || []; } catch (_) { projList = []; }
  const old = lsGet('proiect_electric');   // proiectul salvat înainte să existe lista (rămâne ca rezervă)
  if (old && !projList.length) { projList = ['Proiect 1']; lsSet(lsKey('Proiect 1'), old); }
  current = lsGet('proiect_nume') || ''; if (!projList.includes(current)) current = projList[0] || '';
  if (current) readLocal(current);
  saveList();
}
/* --- galeria --- */
const HOUSE = '<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#222" stroke-width="5"><path d="M8 56V8h48v48M8 28h20M36 8v22h20M36 56V40"/></svg>';
function fmtDate(iso) { if (!iso) return ''; try { return new Date(iso).toLocaleString('ro-RO', { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' }); } catch (_) { return ''; } }
function renderHome() {
  const g = document.getElementById('hgrid'); g.innerHTML = '';
  const dOf = n => lsGet('proiect_data:' + n) || cloudD[n] || '';
  projList.slice().sort((a, b) => dOf(b).localeCompare(dOf(a))).forEach(n => {
    const c = document.createElement('div'); c.className = 'pcard';
    const th = lsGet('proiect_thumb:' + n);
    c.innerHTML = '<div class="th">' + (th ? '<img src="' + th + '">' : HOUSE) + '</div><div><div class="nm">' + escH(n) + '</div><div class="dt">' + escH(fmtDate(dOf(n))) + '</div></div><button class="dots">⋯</button>';
    c.onclick = () => openProject(n);
    c.querySelector('.dots').onclick = ev => showCMenu(ev, n);
    g.appendChild(c);
  });
  const add = (big, t, sub, fn) => { const c = document.createElement('div'); c.className = 'pcard'; c.innerHTML = '<div class="th big">' + big + '</div><div><div class="nm">' + t + '</div><div class="dt">' + sub + '</div></div>'; c.onclick = fn; g.appendChild(c); };
  add('＋', 'Proiect nou', 'Creează un proiect nou', newProject);
  add('⬇', 'Importă proiect', 'Dintr-un fișier .json', importProject);
}
function setView(list) { document.getElementById('hgrid').classList.toggle('list', list); document.getElementById('bgrid').classList.toggle('on', !list); document.getElementById('blist').classList.toggle('on', list); }
function showHome() { if (current) { makeThumb(); save(); cloudFlush(); } renderHome(); fillProj(); document.getElementById('home').style.display = 'flex'; }
function hideHome() { if (current) document.getElementById('home').style.display = 'none'; }
function closeCMenu() { const m = document.getElementById('cmenu'); if (m) m.remove(); }
function showCMenu(ev, name) {
  ev.stopPropagation(); closeCMenu();
  const m = document.createElement('div'); m.id = 'cmenu';
  [['Deschide', () => openProject(name)], ['Redenumește', () => renameProject(name)], ['Copie', () => copyProject(name)], ['Exportă (fișier)', () => exportProject(name)], ['Șterge', () => deleteProject(name)]].forEach(([t, fn]) => {
    const d = document.createElement('div'); d.textContent = t; d.onclick = e => { e.stopPropagation(); closeCMenu(); fn(); }; m.appendChild(d); });
  m.style.left = Math.max(4, Math.min(ev.clientX - 20, innerWidth - 180)) + 'px'; m.style.top = Math.min(ev.clientY + 8, innerHeight - 230) + 'px';
  document.body.appendChild(m);
}
document.addEventListener('pointerdown', e => { if (!e.target.closest || !e.target.closest('#cmenu')) closeCMenu(); });
function openProject(name) { switchProject(name); hideHome(); }
function switchProject(name) {
  if (!name || name === current) return;
  if (current) { makeThumb(); save(); cloudFlush(); }
  clearTimeout(thumbT);
  current = name; resetState(); readLocal(name); saveList(); showProject(); thumbSoon();
  if (GAS) cloudLoad();
}
function newProject() {
  const v = prompt('Numele proiectului nou (de ex. adresa casei):'); if (!v || !v.trim()) return;
  if (current) { makeThumb(); save(); cloudFlush(); }
  clearTimeout(thumbT);
  const nm = uniqueName(v.trim()); projList.push(nm); current = nm; resetState(); saveList(); showProject(); save(); hideHome();
}
function copyProject(name) {
  name = name || current;
  const v = prompt('Copie sub numele:', name + ' (copie)'); if (!v || !v.trim()) return;
  if (name === current) { makeThumb(); save(); }
  const dat = lsGet(lsKey(name)); if (!dat) { alert('Proiectul nu e încă pe acest dispozitiv. Deschide-l o dată, apoi îl poți copia.'); return; }
  const nm = uniqueName(v.trim());
  lsSet(lsKey(nm), dat); lsSet('proiect_data:' + nm, new Date().toISOString()); const th = lsGet('proiect_thumb:' + name); if (th) lsSet('proiect_thumb:' + nm, th);
  projList.push(nm); saveList(); cloudPut(nm, dat); renderHome();
}
function renameProject(name) {
  name = name || current;
  const v = prompt('Numele nou al proiectului:', name); if (!v || !v.trim() || v.trim() === name) return;
  const nm = v.trim(); if (projList.includes(nm)) { alert('Există deja un proiect cu acest nume.'); return; }
  if (name === current) { makeThumb(); clearTimeout(cloudT); cloudPend = null; }
  const dat = name === current ? snap() : lsGet(lsKey(name));
  if (dat) lsSet(lsKey(nm), dat);
  [['proiect_thumb:'], ['proiect_data:']].forEach(([p]) => { const x = lsGet(p + name); if (x) lsSet(p + nm, x); lsDel(p + name); });
  lsDel(lsKey(name)); projList[projList.indexOf(name)] = nm; if (name === current) current = nm; saveList();
  if (GAS) google.script.run.withSuccessHandler(() => { if (nm === current) cloudSave(); }).withFailureHandler(e => setCloud('☁ EROARE la redenumire: ' + (e && e.message || e))).renameProject(name, nm);
  renderHome();
}
function deleteProject(name) {
  name = name || current;
  if (!confirm('Ștergi proiectul „' + name + '” cu tot ce conține?')) return;
  lsDel(lsKey(name)); lsDel('proiect_thumb:' + name); lsDel('proiect_data:' + name); projList = projList.filter(n => n !== name);
  if (name === current) { clearTimeout(cloudT); cloudPend = null; clearTimeout(thumbT); }
  if (GAS) google.script.run.withFailureHandler(e => setCloud('☁ EROARE la ștergere: ' + (e && e.message || e))).deleteProject(name);
  if (name === current) { current = ''; resetState(); showProject(); }
  saveList(); renderHome();
}
function exportProject(name) {
  name = name || current;
  if (name === current) { makeThumb(); save(); }
  const dat = lsGet(lsKey(name)); if (!dat) { alert('Proiectul nu e încă pe acest dispozitiv. Deschide-l o dată și apoi îl poți exporta.'); return; }
  const blob = new Blob([JSON.stringify({ app:'proiect-electric', name, data:JSON.parse(dat) })], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name.replace(/[\\/:*?"<>|]/g, '_') + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importProject() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result), d = o.data || o; if (!d || !d[1]) throw 0;
        const nm = uniqueName(o.name || f.name.replace(/\.json$/i, '') || 'Proiect importat'), dat = JSON.stringify(d);
        lsSet(lsKey(nm), dat); lsSet('proiect_data:' + nm, new Date().toISOString()); projList.push(nm); saveList(); cloudPut(nm, dat); renderHome();
      } catch (_) { alert('Fișierul nu este un proiect valid.'); }
    };
    r.readAsText(f);
  };
  i.click();
}

/* ---------- Salvare în Google (Apps Script + Google Sheet) – se activează doar când pagina rulează din Apps Script ---------- */
const GAS = typeof google !== 'undefined' && google.script && google.script.run;
let cloudT = null, cloudPend = null;
const setCloud = t => { const e = document.getElementById('cloud'); if (e) e.textContent = t; };
function summaryOf(pl, cc) {               // tabel citibil: un rând per circuit
  const g = {};
  pl.forEach(p => p.items.forEach(i => { if (i.t === 'sym' && CAT[i.k]) { const id = (i.id || '?').trim() || '?'; const o = g[id] = g[id] || { l:0, f:0, m:0, w:0, s:0 }; o[CAT[i.k]] += qtyOf(i); } }));
  return Object.keys(g).sort().map(id => { const c = (cc || {})[id] || {}, o = g[id]; return [id, c.cab || '', PLN[c.pl] || '', o.s, o.l, o.f, o.m, o.w]; });
}
const summary = () => summaryOf(plans, circCfg);
function cloudPut(nm, str) {               // trimite direct un proiect (copie / import)
  if (!GAS) return;
  try { const d = JSON.parse(str); google.script.run.withFailureHandler(e => setCloud('☁ EROARE: ' + (e && e.message || e))).saveProject(nm, str, summaryOf(d.plans || [{ items:d[2] || [] }], d.cc)); } catch (_) {}
}
function cloudSave() {
  if (!GAS || !current) return;
  cloudPend = { nm:current, data:snap(), sm:summary() };   // se reține numele și datele de acum
  setCloud('☁ se salvează...'); clearTimeout(cloudT); cloudT = setTimeout(cloudFlush, 1500);
}
function cloudFlush() {
  clearTimeout(cloudT); if (!GAS || !cloudPend) return;
  const p = cloudPend; cloudPend = null;
  google.script.run.withSuccessHandler(() => setCloud('☁ salvat ' + new Date().toLocaleTimeString()))
    .withFailureHandler(e => setCloud('☁ EROARE la salvare: ' + (e && e.message || e))).saveProject(p.nm, p.data, p.sm);
}
function cloudLoad() {
  if (!GAS || !current) return;
  const nm = current; setCloud('☁ se încarcă...');
  google.script.run.withSuccessHandler(j => {
    if (nm !== current) return;
    if (!j) { setCloud('☁ proiect nou: se salvează la prima modificare'); return; }
    resetState(); applyData(JSON.parse(j)); lsSet(lsKey(nm), snap()); showProject(); thumbSoon(); setCloud('☁ încărcat');
  }).withFailureHandler(e => setCloud('☁ EROARE la încărcare: ' + (e && e.message || e))).loadProject(nm);
}
function cloudList() {
  if (!GAS) return;
  google.script.run.withSuccessHandler(l => {
    (l || []).forEach(x => { const n = typeof x === 'string' ? x : x.n; if (!projList.includes(n)) projList.push(n); if (x && x.d) cloudD[n] = x.d; });
    saveList(); if (document.getElementById('home').style.display === 'flex') renderHome();
  }).listProjects();
}

/* ---------- Biblioteca mea de simboluri (PNG) ---------- */
let lib = {};          // id -> { n:nume, d:dataURL, w, h, c:rol, wl:lipit de perete, u:id simbol pt. unifilar }
const IMG = {};
function regSym(id) {
  const e = lib[id], k = 'img_' + id, im = new Image();
  im.onload = () => { redraw(); const pv = document.querySelector('.btn[data-k="' + k + '"] canvas'); if (pv) { pv.width = 72; preview(pv, k, 'sym'); } };
  im.src = e.d; IMG[k] = im;
  S[k] = c => { if (im.complete && im.naturalWidth) c.drawImage(im, -e.w/2, -e.h/2, e.w, e.h); };
  const m = Math.max(e.w, e.h);
  EP[k] = [Math.round(m/2) + 2, m];
  if (e.c) { CAT[k] = e.c; if (!IDSYM.includes(k)) IDSYM.push(k); if (e.c === 's' && !QTY.includes(k)) QTY.push(k); }
  if (e.wl) WALLMOUNT[k] = [0, Math.round(e.h/2) + 2];
  if (e.u) EL[k] = 'img_' + e.u;
}
function libTools() {
  [1, 2].forEach(p => {
    TOOLS[p] = TOOLS[p].filter(s => s[0] !== 'BIBLIOTECA MEA');
    const list = Object.keys(lib).map(id => ['img_' + id, lib[id].n, 'sym']);
    list.push(['lib_add', '＋ Încarcă PNG', 'libadd']);
    list.push(['lib_del', '🗑 Șterge PNG', 'libdel']);
    TOOLS[p].push(['BIBLIOTECA MEA', list]);
  });
}
let libT = null, libReady = !GAS;     // în Apps Script nu trimitem nimic în Drive până nu am citit biblioteca de acolo
function libSave() {
  try { localStorage.setItem('proiect_lib', JSON.stringify(lib)); }       // copie rapidă în browser (nu mai e esențială)
  catch (_) { if (!GAS) alert('Nu mai e loc în browser pentru simboluri. Șterge unele din bibliotecă sau folosește imagini mai mici.'); }
  if (!GAS || !libReady) return;
  setCloud('☁ se salvează biblioteca...');
  clearTimeout(libT);
  libT = setTimeout(() => {
    google.script.run
      .withSuccessHandler(() => setCloud('☁ bibliotecă salvată ' + new Date().toLocaleTimeString()))
      .withFailureHandler(e => setCloud('☁ EROARE la salvarea bibliotecii: ' + (e && e.message || e)))
      .saveLibrary(JSON.stringify(lib));
  }, 800);
}
function libLoad() {                   // pornire rapidă din copia din browser
  try { lib = JSON.parse(localStorage.getItem('proiect_lib')) || {}; } catch (_) { lib = {}; }
  Object.keys(lib).forEach(regSym); libTools();
}
function libCloudLoad() {              // apoi Drive are ultimul cuvânt
  if (!GAS) return;
  setCloud('☁ se încarcă biblioteca...');
  google.script.run.withSuccessHandler(j => {
    let c = {}; try { c = JSON.parse(j) || {}; } catch (_) {}
    const hasCloud = Object.keys(c).length > 0;
    if (hasCloud) { lib = c; Object.keys(lib).forEach(regSym); }          // Drive = sursa de adevăr
    libReady = true;
    libTools(); buildMenu(); setMode(kindOf(md) ? md : 'nav'); redraw();
    if (hasCloud) { try { localStorage.setItem('proiect_lib', JSON.stringify(lib)); } catch (_) {} setCloud('☁ bibliotecă încărcată'); }
    else if (Object.keys(lib).length) libSave();                          // prima dată: urcă în Drive ce aveai deja în browser
    else setCloud('☁ bibliotecă goală');
  }).withFailureHandler(e => setCloud('☁ EROARE la încărcarea bibliotecii: ' + (e && e.message || e))).loadLibrary();
}
function usedLib() {                       // doar simbolurile folosite în proiect (ca să nu umfle fișierul)
  const u = {};
  [pages[1]].concat(plans.map(p => p.items)).forEach(L => L.forEach(i => { if (i.t === 'sym' && i.k.startsWith('img_') && lib[i.k.slice(4)]) u[i.k.slice(4)] = lib[i.k.slice(4)]; }));
  return u;
}
function libDel(id, after) {
  const k = 'img_' + id; if (!confirm('Ștergi „' + lib[id].n + '” și toate aparițiile lui din desene?')) return;
  pages[1] = pages[1].filter(i => i.k !== k); plans.forEach(p => { p.items = p.items.filter(i => i.k !== k); });
  delete lib[id]; delete S[k]; delete CAT[k]; delete EP[k]; delete WALLMOUNT[k]; delete EL[k];
  [IDSYM, QTY].forEach(a => { const j = a.indexOf(k); if (j >= 0) a.splice(j, 1); });
  libSave(); libTools(); buildMenu(); setMode('nav'); redraw(); save(); after();
}
function libDelDlg() {
  const o = dlg('Șterge simbol PNG', '<div class="ll"></div><small>Apasă 🗑 lângă simbolul pe care vrei să-l ștergi. Dispar și toate aparițiile lui din desene.</small><span class="nofocus"></span>', () => true);
  const renderL = () => {
    o.querySelector('.ll').innerHTML = Object.keys(lib).map(id => '<div style="display:flex;align-items:center;gap:10px;margin:6px 0"><img src="' + lib[id].d + '" style="height:36px;max-width:70px;object-fit:contain;border:1px solid #ddd;background:#fff"><span style="flex:1">' + escH(lib[id].n) + '</span><button type="button" data-id="' + id + '" style="padding:6px 12px;color:#c0392b;cursor:pointer">🗑 Șterge</button></div>').join('') || '<small>Nu ai niciun simbol încărcat.</small>';
    o.querySelectorAll('.ll button').forEach(b => b.onclick = () => libDel(b.dataset.id, renderL));
  };
  renderL();
}
function libDlg() {
  let img = null;
  const o = dlg('Biblioteca mea de simboluri',
    '<label>Fișier PNG (fundal transparent):<input type="file" class="lf" accept="image/*"></label><div class="lp" style="min-height:30px;margin:6px 0"></div>' +
    '<label>Nume:<input class="ln full" placeholder="ex. Priză Schuko"></label>' +
    '<label>Rol (pentru Leagă / Generează):<select class="lc full"><option value="">Doar desen (decor)</option><option value="l">Bec / lampă</option><option value="s">Priză</option><option value="w">Întrerupător</option><option value="f">Ventilator</option><option value="m">Motor</option></select></label>' +
    '<label>Lățime pe desen (px):<input class="lw" type="number" min="10" max="200" value="30"></label>' +
    '<label><input type="checkbox" class="lwl"> Se lipește de perete (ca prizele și întrerupătoarele)</label>' +
    '<label>Pe unifilarul generat folosește:<select class="lu full"><option value="">același simbol</option>' + Object.keys(lib).map(id => '<option value="' + id + '">' + escH(lib[id].n) + '</option>').join('') + '</select></label>' +
    '<small>Desenează simbolul centrat, cu „partea de sus” spre cameră. Pe plan se rotește singur după perete.</small>' +
    '<h4 style="margin-top:14px">Simboluri existente</h4><div class="ll"></div><span class="nofocus"></span>',
    d => {
      if (!img) return true;
      const w = Math.max(10, Math.min(200, parseInt(d.querySelector('.lw').value) || 30)), id = newUid();
      lib[id] = { n:d.querySelector('.ln').value.trim() || 'Simbol', d:img.d, w, h:Math.max(4, Math.round(w * img.ar)), c:d.querySelector('.lc').value, wl:d.querySelector('.lwl').checked, u:d.querySelector('.lu').value };
      regSym(id); libSave(); libTools(); buildMenu(); setMode('img_' + id);
    });
  const renderL = () => {
    o.querySelector('.ll').innerHTML = Object.keys(lib).map(id => '<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><img src="' + lib[id].d + '" style="height:28px;max-width:60px;object-fit:contain;border:1px solid #ddd"><span style="flex:1">' + escH(lib[id].n) + '</span><button type="button" data-id="' + id + '">🗑</button></div>').join('') || '<small>Nimic încă.</small>';
    o.querySelectorAll('.ll button').forEach(b => b.onclick = () => libDel(b.dataset.id, renderL));
  };
  renderL();
  o.querySelector('.lf').onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {                  // micșorăm la max. 160px ca să încapă mai multe simboluri în browser
        const s = Math.min(1, 160 / Math.max(im.width, im.height)), t = document.createElement('canvas');
        t.width = Math.max(1, Math.round(im.width * s)); t.height = Math.max(1, Math.round(im.height * s));
        t.getContext('2d').drawImage(im, 0, 0, t.width, t.height);
        img = { d:t.toDataURL('image/png'), ar:im.height / im.width };
        o.querySelector('.lp').innerHTML = '<img src="' + img.d + '" style="max-height:60px;border:1px solid #ccc;background:#fff">';
        const n = o.querySelector('.ln'); if (!n.value) n.value = f.name.replace(/\.[^.]+$/, '');
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };
}
libLoad(); libCloudLoad();

load(); buildMenu(); buildLevels(); buildCabBar(); setMode('nav'); redraw();
(function () {                             // bara de sus: pe PC extinsă, pe tabletă compactă (alegerea ta se ține minte)
  let v = null; try { v = localStorage.getItem('tb_more'); } catch (_) {}
  const touch = matchMedia('(pointer: coarse)').matches || innerWidth < 1000;
  setMore(v === null ? !touch : v === '1', true);
  autoMode();
})();
document.getElementById('cab').addEventListener('input', () => { save(); });
if (GAS) { cloudList(); cloudLoad(); }
renderHome(); document.getElementById('home').style.display = 'flex'; fillProj();     // la pornire se vede galeria de proiecte

/* ---------- Lista „Aparat”: disjunctoare, diferențiale, RCBO, separatoare (LEGRAND) ---------- */
(function () {
  const B = 'LEGRAND', L = [];
  const mcb = (poli, curbe, curenti, ka) => poli.forEach(p => curbe.forEach(c => curenti.forEach(i => L.push(ka + 'kA|' + p + 'P - ' + c + ' ' + i + 'A|' + B))));
  mcb([2], ['C'], [6,10,13,16,20,25,32,40,50,63], 3);
  mcb([1], ['C'], [6,10,16,20,25,32], 3);
  mcb([3], ['C'], [10,16,20,25,32,40,50,63], 3);
  mcb([4], ['C'], [16,20,25,32,40,50,63], 3);
  mcb([2], ['B'], [10,16,20,25,32], 3);
  mcb([3], ['D'], [10,16,25,32,40], 3);
  [2,4].forEach(p => [25,40,63,80,100].forEach(i => [30,300].forEach(m => L.push(p + 'P - ' + i + 'A|Δ' + m + 'mA - tip A|' + B))));   // diferențiale (RCCB)
  [4].forEach(p => [25,40,63].forEach(i => L.push(p + 'P - C ' + i + 'A|Δ300mA - 10kA|' + B)));
  [6,10,16,20,25,32].forEach(i => L.push('2P - C ' + i + 'A|Δ30mA - 6kA|' + B + '|RCBO'));                // disjunctor diferențial combinat
  [25,40,63,100].forEach(i => L.push('4P - ' + i + 'A|Separator'));
  L.push('4P - 25A');
  document.getElementById('apps').innerHTML = L.map(v => '<option value="' + v + '">').join('');
})();
