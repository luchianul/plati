<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ȘantierMaster PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --p: #6366f1;
      --glass: rgba(255, 255, 255, 0.9);
      --border: rgba(255, 255, 255, 0.4);
      --text: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      height: 100vh; display: flex; align-items: center; justify-content: center;
      color: var(--text); overflow: hidden;
    }

    .app-window {
      width: 98vw; height: 95vh; background: var(--glass); backdrop-filter: blur(15px);
      border-radius: 24px; display: flex; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
    }

    nav {
      width: 70px; background: #0f172a; display: flex; flex-direction: column;
      align-items: center; padding: 25px 0; gap: 20px; border-radius: 24px 0 0 24px;
    }
    nav a {
      color: #94a3b8; width: 45px; height: 45px; display: flex; align-items: center; 
      justify-content: center; border-radius: 12px; transition: 0.3s; cursor: pointer;
    }
    nav a.active { background: var(--p); color: white; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

    header {
      padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100;
    }

    header h2 { margin: 0; font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .container { padding: 25px 30px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-card h4 { margin: 0; font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .stat-card div { font-size: 20px; font-weight: 800; margin-top: 5px; }
    
    .summary-section { background: white; padding: 15px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .summary-table th { text-align: left; padding: 12px; background: #f8fafc; color: var(--text-muted); }
    .summary-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }

    .toolbar { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 18px; }
    .search-box { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 10px; }

    .card { display: grid; grid-template-columns: 100px 1.5fr 1.5fr 80px 100px 100px 1fr 100px; gap: 10px; align-items: center; padding: 12px 15px; background: white; border-bottom: 1px solid #eee; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-align: center; }
    .bg-PLATIT { background: #dcfce7; color: #166534; }
    .bg-REST { background: #fef3c7; color: #92400e; }

    .btn { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; }
    .btn-p { background: var(--p); color: white; }
    .btn-outline { background: white; border: 1px solid #ddd; font-size: 12px; padding: 8px 12px; border-radius: 8px; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; backdrop-filter: blur(5px); }
    .modal-content { background: white; width: 400px; margin: 50px auto; padding: 25px; border-radius: 20px; }
    
    label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; }

    .admin-only { display: none; } /* Ascuns by default, afișat din JS */
  </style>
</head>
<body>

<div id="loginOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:9999; display:flex; align-items:center; justify-content:center;">
  <div style="background:white; padding:40px; border-radius:24px; width:300px; text-align:center;">
    <h2>ȘantierMaster</h2>
    <input type="text" id="l_user" placeholder="Utilizator / Email">
    <input type="password" id="l_pass" placeholder="Parolă">
    <button class="btn btn-p" style="width:100%; justify-content:center;" onclick="executaLogin()">Conectare</button>
    <div id="loginMsg" style="color:red; margin-top:15px; font-size:12px;"></div>
  </div>
</div>

<div class="app-window">
  <nav>
    <a id="navSantiere" class="active" onclick="showPage('pageSantiere')"><i data-lucide="home"></i></a>
    <a id="navClienti" onclick="showPage('pageClienti')"><i data-lucide="users"></i></a>
    <a id="navUtilizatori" class="admin-only" onclick="showPage('pageUtilizatori')"><i data-lucide="settings"></i></a>
    <div style="margin-top: auto; padding-bottom: 20px;">
      <a onclick="logout()" style="color:var(--danger)"><i data-lucide="log-out"></i></a>
    </div>
  </nav>

  <div class="main-content">
    <header>
      <div>
        <h2 id="pageTitle">Panou Control</h2>
        <div id="liveClock" style="font-size:12px; color:var(--text-muted)"></div>
      </div>
      <div id="headerActions">
        <button class="btn btn-p" id="btnAddMain" onclick="openAdd()">+ Adaugă Lucrare</button>
      </div>
    </header>

    <div class="container">
      
      <div id="pageSantiere" class="app-page">
        <div class="stats-grid">
          <div class="stat-card"><h4>ORE TOTAL</h4><div id="statOre">0</div></div>
          <div class="stat-card"><h4>ÎNCASAT</h4><div id="statInc">0 €</div></div>
          <div class="stat-card"><h4>REST</h4><div id="statRest" style="color:var(--danger)">0 €</div></div>
          <div class="stat-card"><h4>LUCRĂRI</h4><div id="statNr">0</div></div>
        </div>
        <div class="toolbar">
          <input type="text" class="search-box" id="search" onkeyup="applyFilters()" placeholder="Caută client...">
          <input type="date" id="dateFrom" onchange="applyFilters()" style="width:140px; margin:0">
          <input type="date" id="dateTo" onchange="applyFilters()" style="width:140px; margin:0">
          <button class="btn-outline" onclick="resetFiltre()">🔄 Reset</button>
        </div>
        <div id="mainList"></div>
      </div>

      <div id="pageClienti" class="app-page" style="display:none">
        <div class="summary-section">
          <table class="summary-table">
            <thead>
              <tr><th>CLIENT</th><th>TELEFON</th><th>EMAIL</th><th>ADRESĂ</th><th style="text-align:right">ACȚIUNI</th></tr>
            </thead>
            <tbody id="clientiTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="pageUtilizatori" class="app-page" style="display:none">
        <div class="summary-section">
          <table class="summary-table">
            <thead>
              <tr><th>NUME</th><th>USER/EMAIL</th><th>ROL</th><th style="text-align:right">ACȚIUNI</th></tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <h3 id="mTitle">Detalii Lucrare</h3>
    <input type="hidden" id="e_id">
    <label>Client</label>
    <select id="e_client"><option value="">Alege client...</option></select>
    <label>Locație</label><input type="text" id="e_adr">
    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Start</label><input type="date" id="e_d1"></div>
      <div style="flex:1"><label>Final</label><input type="date" id="e_d2"></div>
    </div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Ora I</label><input type="time" id="e_t1" value="08:00"></div>
      <div style="flex:1"><label>Ora E</label><input type="time" id="e_t2" value="17:00"></div>
    </div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Tarif/h</label><input type="number" id="e_tarif" value="50"></div>
      <div style="flex:1"><label>Avans (€)</label><input type="number" id="e_inc" value="0"></div>
    </div>
    <label>Note</label><textarea id="e_msg"></textarea>
    <button class="btn btn-p" style="width:100%" onclick="save()">Salvează Lucrare</button>
    <button class="btn" style="width:100%; margin-top:10px; background:#eee" onclick="closeM('editModal')">Anulează</button>
  </div>
</div>

<div id="clientModal" class="modal">
  <div class="modal-content">
    <h3>Detalii Client</h3>
    <input type="hidden" id="c_id">
    <label>Nume Client</label><input type="text" id="c_nume">
    <label>Telefon</label><input type="text" id="c_tel">
    <label>Email</label><input type="email" id="c_email">
    <label>Adresa Sediu</label><textarea id="c_adr_s"></textarea>
    <button class="btn btn-p" style="width:100%" onclick="saveClient()">Salvează Client</button>
    <button class="btn" style="width:100%; margin-top:10px; background:#eee" onclick="closeM('clientModal')">Anulează</button>
  </div>
</div>

<div id="userModal" class="modal">
  <div class="modal-content">
    <h3>Setări Utilizator</h3>
    <input type="hidden" id="u_id">
    <label>Nume Complet</label><input type="text" id="u_nume">
    <label>User / Email</label><input type="text" id="u_user">
    <label>Parolă</label><input type="password" id="u_pass">
    <label>Rol</label>
    <select id="u_rol">
      <option value="ADMIN">ADMIN (Acces total)</option>
      <option value="WORKER">WORKER (Adaugă lucrări)</option>
      <option value="VIZITATOR">VIZITATOR (Doar vede)</option>
    </select>
    <button class="btn btn-p" style="width:100%" onclick="saveUser()">Salvează Utilizator</button>
    <button class="btn" style="width:100%; margin-top:10px; background:#eee" onclick="closeM('userModal')">Anulează</button>
  </div>
</div>

<script>
// --- CONFIGURARE SUPABASE ---
const { createClient } = supabase;
const supabaseClient = createClient("https://uuhbdleietpibjjdkmea.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1aGJkbGVpZXRwaWJqamRrbWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTUxMjIsImV4cCI6MjA5MDc5MTEyMn0._8dVAyPb0nfB5b7JgWcI1i6PKaSh7h2uX9FGoJ_Es70");

let allData = [];
let listaClienti = [];
let listaUsers = [];
let currentUser = null;

// --- LOGIN ---
async function executaLogin() {
  const u = document.getElementById('l_user').value.trim();
  const p = document.getElementById('l_pass').value.trim();
  const { data, error } = await supabaseClient.from('Utilizatori').select('*').eq('Email/User', u).eq('Parola', p).single();
  
  if (error || !data) {
    document.getElementById('loginMsg').innerText = "Acces Refuzat!";
    return;
  }
  
  currentUser = data;
  localStorage.setItem('santierUser', JSON.stringify(data));
  document.getElementById('loginOverlay').style.display = 'none';
  checkPermissions();
  load();
}

function checkPermissions() {
  if (currentUser.Rol === 'ADMIN') {
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'flex');
  }
  if (currentUser.Rol === 'VIZITATOR') {
    document.getElementById('btnAddMain').style.display = 'none';
  }
}

// --- NAVIGARE ---
function showPage(p) {
  document.querySelectorAll('.app-page').forEach(pg => pg.style.display = 'none');
  document.getElementById(p).style.display = 'block';
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  document.getElementById('nav' + p.replace('page', '')).classList.add('active');
  
  if(p === 'pageSantiere') { load(); document.getElementById('btnAddMain').onclick = openAdd; }
  if(p === 'pageClienti') { loadClienti(); document.getElementById('btnAddMain').onclick = openAddClient; }
  if(p === 'pageUtilizatori') { loadUsers(); document.getElementById('btnAddMain').onclick = openAddUser; }
}

// --- LOGICA SANTIERE ---
async function load() {
  const { data, error } = await supabaseClient.from('Planificare').select('*').order('id', { ascending: false });
  if (!error) {
    allData = data;
    applyFilters();
  }
}

function render(list) {
  const cont = document.getElementById('mainList');
  cont.innerHTML = '';
  list.forEach(r => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div>${r["Data Start"]}</div>
      <div style="font-weight:800">${r["Client"]}</div>
      <div style="font-size:11px">${r["Adresă"]}</div>
      <div>${r["Total H"]}h</div>
      <div style="font-weight:800">${r["Total de Plată"]}€</div>
      <div><span class="badge ${r["Status"]==='PLATIT'?'bg-PLATIT':'bg-REST'}">${r["Status"]}</span></div>
      <div style="font-size:11px; color:gray">${r["Mesaj"] || '-'}</div>
      <div style="text-align:right">
        ${currentUser.Rol !== 'VIZITATOR' ? `<button class="btn-outline" onclick="openEdit(${r.id})"><i data-lucide="edit"></i></button>` : ''}
      </div>
    `;
    cont.appendChild(div);
  });
  lucide.createIcons();
  updateStats(list);
}

async function save() {
  const id = document.getElementById('e_id').value;
  const d1 = new Date(document.getElementById('e_d1').value);
  const d2 = new Date(document.getElementById('e_d2').value);
  const t1 = document.getElementById('e_t1').value;
  const t2 = document.getElementById('e_t2').value;
  const tarif = parseFloat(document.getElementById('e_tarif').value);
  const avans = parseFloat(document.getElementById('e_inc').value);
  
  const ore = (new Date("1970-01-01 "+t2) - new Date("1970-01-01 "+t1)) / 1000 / 3600;
  
  if (id) {
    const total = (ore * tarif).toFixed(2);
    const row = { "Client": document.getElementById('e_client').value, "Adresă": document.getElementById('e_adr').value, "Data Start": document.getElementById('e_d1').value, "Ora Intrare": t1, "Ora Ieșire": t2, "Sumă Încasată": avans, "Total de Plată": total, "Rest de Plată": (total - avans), "Status": (total-avans) <= 0 ? "PLATIT" : "REST", "Total H": ore };
    await supabaseClient.from('Planificare').update(row).eq('id', id);
  } else {
    const zile = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
    const avansZi = (avans / zile).toFixed(2);
    const rows = [];
    for(let i=0; i<zile; i++) {
      let dataC = new Date(d1); dataC.setDate(d1.getDate() + i);
      const totalZi = (ore * tarif).toFixed(2);
      rows.push({ "Client": document.getElementById('e_client').value, "Adresă": document.getElementById('e_adr').value, "Data Start": dataC.toISOString().split('T')[0], "Ora Intrare": t1, "Ora Ieșire": t2, "Sumă Încasată": avansZi, "Total de Plată": totalZi, "Rest de Plată": (totalZi - avansZi), "Status": (totalZi-avansZi) <= 0 ? "PLATIT" : "REST", "Total H": ore, "Mesaj": `Ziua ${i+1}/${zile}` });
    }
    await supabaseClient.from('Planificare').insert(rows);
  }
  closeM('editModal'); load();
}

// --- LOGICA CLIENTI ---
async function loadClienti() {
  const { data } = await supabaseClient.from('Clienti').select('*').order('Nume Client');
  listaClienti = data;
  const tbody = document.getElementById('clientiTableBody');
  tbody.innerHTML = data.map(c => `
    <tr>
      <td style="font-weight:800">${c["Nume Client"]}</td>
      <td>${c["Telefon"] || '-'}</td>
      <td>${c["Email"] || '-'}</td>
      <td>${c["Adresa Sediu"] || '-'}</td>
      <td style="text-align:right">
        <button class="btn-outline" onclick="openEditClient(${c.id})"><i data-lucide="edit"></i></button>
        ${currentUser.Rol === 'ADMIN' ? `<button class="btn-outline" style="color:red" onclick="deleteClient(${c.id})"><i data-lucide="trash"></i></button>` : ''}
      </td>
    </tr>`).join('');
  lucide.createIcons();
  
  // Update Dropdown in santiere
  const sel = document.getElementById('e_client');
  sel.innerHTML = '<option value="">Alege client...</option>' + data.map(c => `<option value="${c["Nume Client"]}">${c["Nume Client"]}</option>`).join('');
}

async function saveClient() {
  const id = document.getElementById('c_id').value;
  const row = { "Nume Client": document.getElementById('c_nume').value, "Telefon": document.getElementById('c_tel').value, "Email": document.getElementById('c_email').value, "Adresa Sediu": document.getElementById('c_adr_s').value };
  if(id) await supabaseClient.from('Clienti').update(row).eq('id', id);
  else await supabaseClient.from('Clienti').insert([row]);
  closeM('clientModal'); loadClienti();
}

// --- LOGICA UTILIZATORI ---
async function loadUsers() {
  const { data } = await supabaseClient.from('Utilizatori').select('*');
  listaUsers = data;
  const tbody = document.getElementById('usersTableBody');
  tbody.innerHTML = data.map(u => `
    <tr>
      <td style="font-weight:800">${u.Nume}</td>
      <td>${u["Email/User"]}</td>
      <td><span class="badge" style="background:#eee">${u.Rol}</span></td>
      <td style="text-align:right">
        <button class="btn-outline" onclick="openEditUser(${u.id})"><i data-lucide="edit"></i></button>
        <button class="btn-outline" style="color:red" onclick="deleteUser(${u.id})"><i data-lucide="trash"></i></button>
      </td>
    </tr>`).join('');
  lucide.createIcons();
}

async function saveUser() {
  const id = document.getElementById('u_id').value;
  const row = { "Nume": document.getElementById('u_nume').value, "Email/User": document.getElementById('u_user').value, "Parola": document.getElementById('u_pass').value, "Rol": document.getElementById('u_rol').value };
  if(id) await supabaseClient.from('Utilizatori').update(row).eq('id', id);
  else await supabaseClient.from('Utilizatori').insert([row]);
  closeM('userModal'); loadUsers();
}

async function deleteUser(id) {
    if(confirm("Ștergi acest utilizator?")) {
        await supabaseClient.from('Utilizatori').delete().eq('id', id);
        loadUsers();
    }
}

// --- UTILS ---
function openAdd() { document.getElementById('e_id').value = ''; document.getElementById('editModal').style.display = 'block'; }
function openEdit(id) {
  const r = allData.find(x => x.id == id);
  document.getElementById('e_id').value = r.id;
  document.getElementById('e_client').value = r["Client"];
  document.getElementById('e_adr').value = r["Adresă"];
  document.getElementById('e_d1').value = r["Data Start"];
  document.getElementById('e_tarif').value = r["Tarif/Oră"];
  document.getElementById('e_inc').value = r["Sumă Încasată"];
  document.getElementById('editModal').style.display = 'block';
}

function openAddClient() { document.getElementById('c_id').value = ''; document.getElementById('clientModal').style.display = 'block'; }
function openEditClient(id) {
  const c = listaClienti.find(x => x.id == id);
  document.getElementById('c_id').value = c.id;
  document.getElementById('c_nume').value = c["Nume Client"];
  document.getElementById('c_tel').value = c["Telefon"];
  document.getElementById('clientModal').style.display = 'block';
}

function openAddUser() { document.getElementById('u_id').value = ''; document.getElementById('userModal').style.display = 'block'; }
function openEditUser(id) {
  const u = listaUsers.find(x => x.id == id);
  document.getElementById('u_id').value = u.id;
  document.getElementById('u_nume').value = u.Nume;
  document.getElementById('u_user').value = u["Email/User"];
  document.getElementById('u_pass').value = u.Parola;
  document.getElementById('u_rol').value = u.Rol;
  document.getElementById('userModal').style.display = 'block';
}

function closeM(id) { document.getElementById(id).style.display = 'none'; }

function applyFilters() {
  const s = document.getElementById('search').value.toLowerCase();
  const filtered = allData.filter(r => r["Client"].toLowerCase().includes(s));
  render(filtered);
}

function updateStats(list) {
  const ore = list.reduce((a,b) => a + (parseFloat(b["Total H"])||0), 0);
  const inc = list.reduce((a,b) => a + (parseFloat(b["Sumă Încasată"])||0), 0);
  const rest = list.reduce((a,b) => a + (parseFloat(b["Rest de Plată"])||0), 0);
  document.getElementById('statOre').innerText = ore.toFixed(1);
  document.getElementById('statInc').innerText = inc.toFixed(0) + " €";
  document.getElementById('statRest').innerText = rest.toFixed(0) + " €";
  document.getElementById('statNr').innerText = list.length;
}

function logout() { localStorage.clear(); location.reload(); }

window.onload = () => {
  setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleString('ro-RO'); }, 1000);
  const saved = localStorage.getItem('santierUser');
  if(saved) {
    currentUser = JSON.parse(saved);
    document.getElementById('loginOverlay').style.display = 'none';
    checkPermissions();
    load();
  }
  lucide.createIcons();
};
</script>
</body>
</html>
