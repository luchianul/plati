<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const { createClient } = supabase;
  const supabaseClient = createClient("https://uuhbdleietpibjjdkmea.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1aGJkbGVpZXRwaWJqamRrbWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMTUxMjIsImV4cCI6MjA5MDc5MTEyMn0._8dVAyPb0nfB5b7JgWcI1i6PKaSh7h2uX9FGoJ_Es70");
</script>
  <style>
   /* PASTRAT EXACT DIN CODUL TAU INITIAL */
    :root {
      --p: #6366f1;
      --glass: rgba(255, 255, 255, 0.9);
      --border: rgba(255, 255, 255, 0.4);
      --text: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      height: 100vh; display: flex; align-items: center; justify-content: center;
      color: var(--text); overflow: hidden;
    }

    .app-window {
      width: 98vw; height: 95vh; background: var(--glass); backdrop-filter: blur(15px);
      border-radius: 24px; display: flex; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
    }

    nav {
      width: 70px; background: #0f172a; display: flex; flex-direction: column;
      align-items: center; padding: 25px 0; gap: 20px; border-radius: 24px 0 0 24px;
    }
    nav a {
      color: #94a3b8; width: 45px; height: 45px; display: flex; align-items: center; 
      justify-content: center; border-radius: 12px; transition: 0.3s; cursor: pointer;
    }
    nav a.active { background: var(--p); color: white; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

    header {
      padding: 20px 30px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      background: rgba(255, 255, 255, 0.7); 
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: sticky; 
      top: 0; 
      z-index: 100;
    }

    header h2 {
      margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #liveClock { font-size: 12px; font-weight: 600; color: #64748b; margin-top: 5px; display: flex; align-items: center; gap: 5px; }

    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .dot-live { display: inline-block; width: 8px; height: 8px; background: #10b981; border-radius: 50%; margin-right: 8px; animation: pulse-green 2s infinite; }

    .container { padding: 25px 30px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-card h4 { margin: 0; font-size: 12px; color: var(--text-muted); }
    .stat-card div { font-size: 20px; font-weight: 800; margin-top: 5px; }
    
    .summary-section { background: white; padding: 15px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #e2e8f0; overflow-x: auto; }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
    .summary-table th { text-align: left; padding: 10px; background: #f8fafc; color: var(--text-muted); }
    .summary-table td { padding: 10px; border-bottom: 1px solid #f1f5f9; }

    .toolbar { 
      display: flex; gap: 15px; align-items: center; justify-content: center; margin-bottom: 20px; 
      flex-wrap: wrap; background: white; padding: 15px; border-radius: 18px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .search-box { 
      flex: 1; max-width: 300px; padding: 10px; border: 1px solid #ddd; border-radius: 10px; height: 42px; box-sizing: border-box;
    }

    .card {
      display: grid;
      grid-template-columns: 100px 1.5fr 2fr 80px 100px 100px 1.2fr 80px;
      gap: 10px; align-items: center; padding: 12px 15px; background: white; border-bottom: 1px solid #eee;
      transition: background 0.2s; min-width: 1000px;
    }

    .card:hover { background: #f8fafc; }
    .card.is-archived { opacity: 0.5; background: #f8fafc; }

    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .bg-PLATIT { background: #dcfce7; color: #166534; }
    .bg-REST { background: #fef3c7; color: #92400e; }

    .btn { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; }
    .btn-p { background: var(--p); color: white; }
    .btn-outline { background: white; border: 1px solid #ddd; font-size: 12px; padding: 8px 12px; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; backdrop-filter: blur(5px); }
    .modal-content { background: white; width: 420px; margin: 30px auto; padding: 25px; border-radius: 20px; max-height: 90vh; overflow-y: auto; }
    
    label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }

    .list-header {
      display: grid;
      grid-template-columns: 100px 1.5fr 2fr 80px 100px 100px 1.2fr 80px;
      gap: 10px; align-items: center; padding: 10px 15px; background: #f1f5f9; font-weight: 800; font-size: 13px; border-radius: 8px; min-width: 1000px; 
    }

    #mainList { overflow-x: auto; width: 100%; display: block; }
  </style>
</head>
<body>

<div id="desktop-view">
  <div id="loginOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div style="background:white; padding:40px; border-radius:24px; width:320px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5); text-align:center;">
      <h2 style="margin-bottom:10px;">ȘantierMaster</h2>
      <p style="color:#64748b; font-size:14px; margin-bottom:25px;">Introdu datele de acces</p>
      <input type="text" id="l_user" placeholder="Utilizator">
      <input type="password" id="l_pass" placeholder="Parolă">
      <button class="btn btn-p" style="width:100%; justify-content:center;" onclick="executaLogin()">Conectare</button>
      <div id="loginMsg" style="color:red; margin-top:15px; font-size:12px;"></div>
    </div>
  </div>

  <div class="app-window">
    <nav>
      <a id="navSantiere" class="active" onclick="showPage('pageSantiere')"><i data-lucide="home"></i></a>
      <a id="navClienti" onclick="showPage('pageClienti')"><i data-lucide="users"></i></a>
      <a id="navUtilizatori" onclick="showPage('pageUtilizatori')"><i data-lucide="settings"></i></a>
      <a id="navLog" onclick="showPage('pageLog')" style="display:none;"><i data-lucide="activity"></i></a>

      <div style="margin-top: auto; padding-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%;">
        <div id="userBadge" style="display: none; text-align: center;">
          <div id="u_initials" style="width: 35px; height: 35px; background: var(--p); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; margin: 0 auto 5px;">??</div>
          <div id="u_display_rol" style="font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">-</div>
        </div>
        <a title="Deconectare" onclick="logout()" style="color: #ef4444;"><i data-lucide="log-out"></i></a>
      </div>
    </nav>

    <div class="main-content">
      <header>
        <div>
          <h2 style="margin:0;">ȘantierMaster PRO</h2>
          <div id="liveClock"></div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-p" onclick="openAdd()">+ Adaugă Lucrare</button>
        </div>
      </header>

      <div class="container">
        
        <div id="pageSantiere" class="app-page">
          <div class="stats-grid">
            <div class="stat-card"><h4>ORE TOTAL</h4><div id="statOre">0</div></div>
            <div class="stat-card"><h4>ÎNCASAT</h4><div id="statInc">0 €</div></div>
            <div class="stat-card"><h4>REST DE PLATĂ</h4><div id="statRest" style="color:var(--danger)">0 €</div></div>
            <div class="stat-card"><h4>ȘANTIERE</h4><div id="statNr">0</div></div>
          </div>
          
          <div class="toolbar">
            <input type="text" class="search-box" id="search" onkeyup="applyFilters()" placeholder="🔍 Caută client, locație...">
            <input type="date" id="dateFrom" onchange="applyFilters()" style="width:140px; margin:0;">
            <input type="date" id="dateTo" onchange="applyFilters()" style="width:140px; margin:0;">
            <label style="margin:0; display:flex; align-items:center; gap:5px;">
                <input type="checkbox" id="showArchived" onchange="applyFilters()" style="width:auto; margin:0;"> Arhivă
            </label>
            <button class="btn-outline" onclick="resetareFiltreDate()">🔄 Reset</button>
          </div>

          <div class="list-header">
            <div>DATA</div><div>CLIENT</div><div>LOCAȚIE</div><div>ORE</div><div>TOTAL</div><div>STATUS</div><div>NOTE</div><div style="text-align:right">ACȚIUNI</div>
          </div>
          <div id="mainList"></div>
        </div>

        <div id="pageClienti" class="app-page" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2>Gestiune Clienți</h2>
                <button class="btn btn-p" onclick="Swal.fire('Info', 'Modul in lucru', 'info')">+ Client Nou</button>
            </div>
            <div class="summary-section">Datele se vor incarca aici...</div>
        </div>

        <div id="pageUtilizatori" class="app-page" style="display:none;">
            <h2>Setări Utilizatori</h2>
        </div>

      </div>
    </div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <h3 id="mTitle" style="margin-top:0; color:var(--p)">Detalii Lucrare</h3>
    <input type="hidden" id="e_id">
    <label>Client</label><input type="text" id="e_client">
    <label>Locație</label><input type="text" id="e_adr">
    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Data Start</label><input type="date" id="e_d1"></div>
      <div style="flex:1"><label>Data Final</label><input type="date" id="e_d2"></div>
    </div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Ora Start</label><input type="time" id="e_t1"></div>
      <div style="flex:1"><label>Ora Final</label><input type="time" id="e_t2"></div>
    </div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1"><label>Tarif/h (€)</label><input type="number" id="e_tarif" value="50"></div>
      <div style="flex:1"><label>Încasat (€)</label><input type="number" id="e_inc" value="0"></div>
    </div>
    <label>Note</label><textarea id="e_msg" rows="3"></textarea>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-p" style="flex:2" onclick="save()">💾 Salvează</button>
      <button class="btn" style="flex:1; background:#eee" onclick="closeM('editModal')">Anulează</button>
    </div>
  </div>
</div>

<script>
let allData = [];
let currentUser = null;

// --- 1. LOGIN ---
async function executaLogin() {
    const u = document.getElementById('l_user').value.trim();
    const p = document.getElementById('l_pass').value.trim();
    const msg = document.getElementById('loginMsg');
    
    try {
        const { data, error } = await supabaseClient.from('Utilizatori')
            .select('*').eq('"Email/User"', u).eq('"Parola"', p).single();

        if (error || !data) {
            msg.innerText = "Date incorecte!";
            return;
        }

        currentUser = { nume: data.Nume, user: data["Email/User"], rol: data.Rol };
        localStorage.setItem('santierUser', JSON.stringify(currentUser));
        document.getElementById('loginOverlay').style.display = 'none';
        initializareUI();
        load();
    } catch (e) { msg.innerText = "Eroare conexiune!"; }
}

// --- 2. LOAD DATA ---
async function load() {
    const { data, error } = await supabaseClient.from('Planificare')
        .select('*').order('id', { ascending: false });
    
    if (!error) {
        // Mapam datele exact cum le foloseste functia applyFilters/render
        allData = data.map(r => [
            r["Client"], r["Adresă"], r["Data Start"], r["Data Final"], 
            r["Ora Intrare"], r["Ora Ieșire"], r["Sumă Încasată"], 
            r["Tarif/Oră"], r["Total de Plată"], r["Rest de Plată"], 
            r["Status"], r["Total H"], r["Mesaj"], r["Arhivă"], r["id"]
        ]);
        applyFilters();
    }
}

// --- 3. RENDER ---
function render(data) {
    const cont = document.getElementById('mainList');
    cont.innerHTML = '';
    
    data.forEach(r => {
        const div = document.createElement('div');
        div.className = `card ${r[13] ? 'is-archived' : ''}`;
        div.innerHTML = `
            <div>${r[2] || '-'}</div>
            <div style="font-weight:800">${r[0]}</div>
            <div style="font-size:12px">${r[1]}</div>
            <div>${r[11] || 0}h</div>
            <div style="font-weight:800">${r[8]} €</div>
            <div><span class="badge ${r[10]==='PLATIT'?'bg-PLATIT':'bg-REST'}">${r[10]}</span></div>
            <div style="font-size:11px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${r[12] || '-'}</div>
            <div style="text-align:right">
                <button class="btn-outline" onclick="openEdit(${r[14]})"><i data-lucide="edit-3" style="width:14px"></i></button>
            </div>
        `;
        cont.appendChild(div);
    });
    lucide.createIcons();
}

// --- 4. SAVE (ADD/EDIT) ---
async function save() {
    const id = document.getElementById('e_id').value;
    
    // Calcul simplu ore (poti rafina ulterior)
    const t1 = document.getElementById('e_t1').value;
    const t2 = document.getElementById('e_t2').value;
    let ore = 8; // default
    if(t1 && t2) {
        const diff = (new Date("1970-01-01 " + t2) - new Date("1970-01-01 " + t1)) / 1000 / 3600;
        ore = diff > 0 ? diff.toFixed(1) : 8;
    }

    const tarif = parseFloat(document.getElementById('e_tarif').value) || 0;
    const incasat = parseFloat(document.getElementById('e_inc').value) || 0;
    const total = (ore * tarif).toFixed(2);
    const rest = (total - incasat).toFixed(2);

    const row = {
        "Client": document.getElementById('e_client').value,
        "Adresă": document.getElementById('e_adr').value,
        "Data Start": document.getElementById('e_d1').value,
        "Data Final": document.getElementById('e_d2').value,
        "Ora Intrare": t1,
        "Ora Ieșire": t2,
        "Tarif/Oră": tarif,
        "Sumă Încasată": incasat,
        "Total de Plată": total,
        "Rest de Plată": rest,
        "Status": rest <= 0 ? "PLATIT" : "REST",
        "Total H": ore,
        "Mesaj": document.getElementById('e_msg').value
    };

    const { error } = id ? 
        await supabaseClient.from('Planificare').update(row).eq('id', id) : 
        await supabaseClient.from('Planificare').insert([row]);

    if (!error) {
        Swal.fire('Salvat!', '', 'success');
        closeM('editModal');
        load();
    } else {
        Swal.fire('Eroare', error.message, 'error');
    }
}

// --- 5. UTILS ---
function openEdit(id) {
    const r = allData.find(x => x[14] == id);
    document.getElementById('e_id').value = r[14];
    document.getElementById('e_client').value = r[0];
    document.getElementById('e_adr').value = r[1];
    document.getElementById('e_d1').value = r[2];
    document.getElementById('e_d2').value = r[3];
    document.getElementById('e_t1').value = r[4];
    document.getElementById('e_t2').value = r[5];
    document.getElementById('e_inc').value = r[6];
    document.getElementById('e_tarif').value = r[7];
    document.getElementById('e_msg').value = r[12];
    document.getElementById('mTitle').innerText = "Editare Lucrare";
    document.getElementById('editModal').style.display = 'block';
}

function openAdd() {
    document.getElementById('e_id').value = '';
    document.querySelectorAll('#editModal input:not([type=hidden])').forEach(i => i.value = '');
    document.getElementById('e_tarif').value = 50;
    document.getElementById('e_inc').value = 0;
    document.getElementById('mTitle').innerText = "Lucrare Nouă";
    document.getElementById('editModal').style.display = 'block';
}

function applyFilters() {
    const s = document.getElementById('search').value.toLowerCase();
    const d1 = document.getElementById('dateFrom').value;
    const d2 = document.getElementById('dateTo').value;
    const arc = document.getElementById('showArchived').checked;

    const filtered = allData.filter(r => {
        const matchesS = r[0].toLowerCase().includes(s) || r[1].toLowerCase().includes(s);
        const matchesD = (!d1 || r[2] >= d1) && (!d2 || r[2] <= d2);
        const matchesA = arc ? true : !r[13];
        return matchesS && matchesD && matchesA;
    });

    render(filtered);
    updateStats(filtered);
}

function updateStats(data) {
    const ore = data.reduce((a,b) => a + (parseFloat(b[11])||0), 0);
    const inc = data.reduce((a,b) => a + (parseFloat(b[6])||0), 0);
    const rest = data.reduce((a,b) => a + (parseFloat(b[9])||0), 0);
    document.getElementById('statOre').innerText = ore.toFixed(1);
    document.getElementById('statInc').innerText = inc.toFixed(2) + " €";
    document.getElementById('statRest').innerText = rest.toFixed(2) + " €";
    document.getElementById('statNr').innerText = data.length;
}

function showPage(p) {
    document.querySelectorAll('.app-page').forEach(pg => pg.style.display = 'none');
    document.getElementById(p).style.display = 'block';
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    if(p==='pageSantiere') document.getElementById('navSantiere').classList.add('active');
    if(p==='pageClienti') document.getElementById('navClienti').classList.add('active');
}

function closeM(id) { document.getElementById(id).style.display = 'none'; }
function resetareFiltreDate() { 
    document.getElementById('dateFrom').value = ''; 
    document.getElementById('dateTo').value = ''; 
    applyFilters(); 
}
function initializareUI() {
    document.getElementById('userBadge').style.display = 'block';
    document.getElementById('u_display_rol').innerText = currentUser.rol;
    document.getElementById('u_initials').innerText = currentUser.nume.substring(0,2).toUpperCase();
    if(currentUser.rol === 'ADMIN') document.getElementById('navLog').style.display = 'flex';
}
function logout() { localStorage.clear(); location.reload(); }

window.onload = () => {
    lucide.createIcons();
    setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleString(); }, 1000);
    const saved = localStorage.getItem('santierUser');
    if(saved) {
        currentUser = JSON.parse(saved);
        document.getElementById('loginOverlay').style.display = 'none';
        initializareUI();
        load();
    }
};
</script>
</body>
</html>
