  <style>
    :root {
      --p: #6366f1;
      --glass: rgba(255, 255, 255, 0.9);
      --border: rgba(255, 255, 255, 0.4);
      --text: #1e293b;

      --danger: #ef4444;

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      margin: 0; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      height: 100vh; display: flex; align-items: center; justify-content: center;
      color: var(--text); overflow: hidden;
    }

    .app-window {
      width: 98vw; height: 95vh; background: var(--glass); backdrop-filter: blur(15px);
      border-radius: 24px; display: flex; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
    }

      width: 70px; background: #0f172a; display: flex; flex-direction: column;
      align-items: center; padding: 25px 0; gap: 20px; border-radius: 24px 0 0 24px;
    }
    nav a {
      color: #94a3b8; width: 45px; height: 45px; display: flex; align-items: center; 
      justify-content: center; border-radius: 12px; transition: 0.3s; cursor: pointer;
    }
    nav a.active { background: var(--p); color: white; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

    header {
      padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100;
    }

    header h2 {
      margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    #liveClock { font-size: 12px; font-weight: 600; color: #64748b; margin-top: 5px; }

    .container { padding: 25px 30px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-card h4 { margin: 0; font-size: 12px; color: var(--text-muted); }
    .stat-card div { font-size: 20px; font-weight: 800; margin-top: 5px; }
    
    .summary-section { background: white; padding: 15px; border-radius: 18px; margin-bottom: 20px; border: 1px solid #e2e8f0; overflow-x: auto; }
    .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
    .summary-table th { text-align: left; padding: 12px; background: #f8fafc; color: var(--text-muted); }
    .summary-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }

    .toolbar { 
      display: flex; gap: 15px; align-items: center; justify-content: center; margin-bottom: 20px; 
      flex-wrap: wrap; background: white; padding: 15px; border-radius: 18px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .search-box { flex: 1; max-width: 300px; padding: 10px; border: 1px solid #ddd; border-radius: 10px; height: 42px; }

    .card {
      display: grid; grid-template-columns: 100px 1.5fr 2fr 80px 100px 100px 1.2fr 80px;
      gap: 10px; align-items: center; padding: 12px 15px; background: white; border-bottom: 1px solid #eee;
      transition: background 0.2s; min-width: 1000px;
    }
    .card:hover { background: #f8fafc; }

    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .bg-PLATIT { background: #dcfce7; color: #166534; }
    .bg-REST { background: #fef3c7; color: #92400e; }

    .btn { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; }
    .btn-p { background: var(--p); color: white; }
    .btn-outline { background: white; border: 1px solid #ddd; font-size: 12px; padding: 8px 12px; border-radius: 8px; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; backdrop-filter: blur(5px); }
    .modal-content { background: white; width: 420px; margin: 30px auto; padding: 25px; border-radius: 20px; max-height: 90vh; overflow-y: auto; }
    
    label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    input, textarea, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }

    .list-header {
      display: grid; grid-template-columns: 100px 1.5fr 2fr 80px 100px 100px 1.2fr 80px;
      gap: 10px; align-items: center; padding: 10px 15px; background: #f1f5f9; font-weight: 800; font-size: 13px; border-radius: 8px; min-width: 1000px; 
    }
  </style>
</head>
<body>

<div class="app-window">
  <nav>

        <div id="u_display_rol" style="font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">-</div>
      </div>
      <a onclick="logout()" style="color: #ef4444;"><i data-lucide="log-out"></i></a>
    </div>
  </nav>

  <div class="main-content">
    <header>
      <div>
        <h2 id="pageMainTitle">ȘantierMaster PRO</h2>
        <div id="liveClock"></div>
      </div>
      <div id="headerActionBtn">
        <button class="btn btn-p" id="btnUniversal" onclick="openAdd()">+ Adaugă Lucrare</button>
      </div>

    <div class="container">
      
      <div id="pageSantiere" class="app-page">
        <div class="stats-grid">
          <div class="stat-card"><h4>ORE TOTAL</h4><div id="statOre">0</div></div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <h3 id="mTitle" style="margin-top:0; color:var(--p)">Detalii Lucrare</h3>
    <input type="hidden" id="e_id">
    <label>Client</label><input type="text" id="e_client">

      <button class="btn btn-p" style="flex:2" onclick="save()">💾 Salvează</button>

</div>

<div id="userModal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:var(--p)">Setări Utilizator</h3>
    <input type="hidden" id="u_id">
    <label>Nume Complet</label><input type="text" id="u_nume">
    <label>Email / User</label><input type="text" id="u_user">
    <label>Parolă (Numere)</label><input type="number" id="u_pass">
    <label>Rol</label>
    <select id="u_rol">
      <option value="ADMIN">ADMIN</option>
      <option value="WORKER">WORKER</option>
      <option value="VIZITATOR">VIZITATOR</option>
    </select>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-p" style="flex:2" onclick="saveUser()">💾 Salvează User</button>
      <button class="btn" style="flex:1; background:#eee" onclick="closeM('userModal')">Anulează</button>

<script>
let allData = [];
let listaClienti = [];
let listaUsers = [];
let currentUser = null;

// --- 1. LOGIN ---
async function executaLogin() {
    const u = document.getElementById('l_user').value.trim();
    const p = document.getElementById('l_pass').value.trim();
    const msg = document.getElementById('loginMsg');
    
    try {
        const { data, error } = await supabaseClient.from('Utilizatori')
            .select('*').eq('"Email/User"', u).eq('"Parola"', p).single();

        if (error || !data) {
            msg.innerText = "Date incorecte!";
            return;
        }

        currentUser = { nume: data.Nume, user: data["Email/User"], rol: data.Rol };
        localStorage.setItem('santierUser', JSON.stringify(currentUser));
        document.getElementById('loginOverlay').style.display = 'none';
        initializareUI();
        load();
    } catch (e) { msg.innerText = "Eroare conexiune!"; }
}

// --- 2. SANTIERE (Planificare) ---
async function load() {
    const { data, error } = await supabaseClient.from('Planificare').select('*').order('id', { ascending: false });
    if (!error) {
        allData = data.map(r => [
            r["Client"], r["Adresă"], r["Data Start"], r["Data Final"], 
            r["Ora Intrare"], r["Ora Ieșire"], r["Sumă Încasată"], 
            r["Tarif/Oră"], r["Total de Plată"], r["Rest de Plată"], 
            r["Status"], r["Total H"], r["Mesaj"], r["Arhivă"], r["id"]
        ]);
        applyFilters();
    }
}

function render(data) {
    const cont = document.getElementById('mainList');
    cont.innerHTML = '';
    data.forEach(r => {
        const div = document.createElement('div');
        div.className = `card ${r[13] ? 'is-archived' : ''}`;
        div.innerHTML = `
            <div>${r[2] || '-'}</div>
            <div style="font-weight:800">${r[0]}</div>
            <div style="font-size:12px">${r[1]}</div>
            <div>${r[11] || 0}h</div>
            <div style="font-weight:800">${r[8]} €</div>
            <div><span class="badge ${r[10]==='PLATIT'?'bg-PLATIT':'bg-REST'}">${r[10]}</span></div>
            <div style="font-size:11px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${r[12] || '-'}</div>
            <div style="text-align:right">
                <button class="btn-outline" onclick="openEdit(${r[14]})"><i data-lucide="edit-3" style="width:14px"></i></button>
            </div>
        `;
        cont.appendChild(div);
    });
    lucide.createIcons();
}

async function save() {
    const id = document.getElementById('e_id').value;
    const client = document.getElementById('e_client').value;
    const adresa = document.getElementById('e_adr').value;
    const d1 = new Date(document.getElementById('e_d1').value);
    const d2 = new Date(document.getElementById('e_d2').value);
    const t1 = document.getElementById('e_t1').value;
    const t2 = document.getElementById('e_t2').value;
    const tarif = parseFloat(document.getElementById('e_tarif').value) || 0;
    const avansTotal = parseFloat(document.getElementById('e_inc').value) || 0;
    const mesaj = document.getElementById('e_msg').value;

    if (id) {
        const ore = calculOre(t1, t2);
        const total = parseFloat((ore * tarif).toFixed(2));
        const rest = parseFloat((total - avansTotal).toFixed(2));
        const row = { "Client": client, "Adresă": adresa, "Data Start": document.getElementById('e_d1').value, "Ora Intrare": t1, "Ora Ieșire": t2, "Tarif/Oră": tarif, "Sumă Încasată": avansTotal, "Total de Plată": total, "Rest de Plată": rest, "Status": rest <= 0 ? "PLATIT" : "REST", "Total H": ore, "Mesaj": mesaj };
        const { error } = await supabaseClient.from('Planificare').update(row).eq('id', id);
        handleResponse(error, 'editModal');
    } else {
        const interval = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
        if (interval <= 0) { Swal.fire('Eroare', 'Data finală greșită!', 'error'); return; }
        const avansZi = parseFloat((avansTotal / interval).toFixed(2));
        const rows = [];
        for (let i = 0; i < interval; i++) {
            let dc = new Date(d1); dc.setDate(d1.getDate() + i);
            const ore = calculOre(t1, t2);
            const totalZi = parseFloat((ore * tarif).toFixed(2));
            rows.push({ "Client": client, "Adresă": adresa, "Data Start": dc.toISOString().split('T')[0], "Ora Intrare": t1, "Ora Ieșire": t2, "Tarif/Oră": tarif, "Sumă Încasată": avansZi, "Total de Plată": totalZi, "Rest de Plată": (totalZi - avansZi), "Status": (totalZi - avansZi) <= 0 ? "PLATIT" : "REST", "Total H": ore, "Mesaj": mesaj + (interval > 1 ? ` (${i+1}/${interval})` : "") });
        }
        const { error } = await supabaseClient.from('Planificare').insert(rows);
        handleResponse(error, 'editModal');
    }
}

// --- 3. CLIENTI ---
async function loadClienti() {
    const { data, error } = await supabaseClient.from('Clienti').select('*').order('Nume Client');
    if (!error) {
        listaClienti = data;
        const tbody = document.getElementById('clientiTableBody');
        tbody.innerHTML = data.map(c => `
            <tr>
                <td style="font-weight:800">${c["Nume Client"]}</td>
                <td>${c["Telefon"] || '-'}</td>
                <td>${c["Email"] || '-'}</td>
                <td>${c["Adresa Sediu"] || '-'}</td>
                <td style="text-align:right">
                    <button class="btn-outline" onclick="editClient(${c.id})"><i data-lucide="edit-3" style="width:14px"></i></button>
                    <button class="btn-outline" style="color:red" onclick="deleteItem('Clienti', ${c.id}, loadClienti)"><i data-lucide="trash-2" style="width:14px"></i></button>
                </td>
            </tr>`).join('');
        lucide.createIcons();
    }
}

async function saveClient() {
    const id = document.getElementById('c_id').value;
    const row = { "Nume Client": document.getElementById('c_nume').value, "Telefon": document.getElementById('c_tel').value, "Email": document.getElementById('c_email').value, "Adresa Sediu": document.getElementById('c_adr_c').value };
    const { error } = id ? await supabaseClient.from('Clienti').update(row).eq('id', id) : await supabaseClient.from('Clienti').insert([row]);
    handleResponse(error, 'clientModal', loadClienti);
}

function editClient(id) {
    const c = listaClienti.find(x => x.id == id);
    document.getElementById('c_id').value = c.id;
    document.getElementById('c_nume').value = c["Nume Client"];
    document.getElementById('c_tel').value = c["Telefon"];
    document.getElementById('c_email').value = c["Email"];
    document.getElementById('c_adr_c').value = c["Adresa Sediu"];
    document.getElementById('clientModal').style.display = 'block';
}

// --- 4. UTILIZATORI ---
async function loadUsers() {
    const { data, error } = await supabaseClient.from('Utilizatori').select('*').order('Nume');
    if (!error) {
        listaUsers = data;
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = data.map(u => `
            <tr>
                <td style="font-weight:800">${u.Nume}</td>
                <td>${u["Email/User"]}</td>
                <td><span class="badge" style="background:#eee">${u.Rol}</span></td>
                <td style="font-size:11px">${u.Creat || '-'}</td>
                <td style="text-align:right">
                    <button class="btn-outline" onclick="editUser(${u.id})"><i data-lucide="edit-3" style="width:14px"></i></button>
                    <button class="btn-outline" style="color:red" onclick="deleteItem('Utilizatori', ${u.id}, loadUsers)"><i data-lucide="trash-2" style="width:14px"></i></button>
                </td>
            </tr>`).join('');
        lucide.createIcons();
    }
}

async function saveUser() {
    const id = document.getElementById('u_id').value;
    const row = { 
        "Nume": document.getElementById('u_nume').value, 
        "Email/User": document.getElementById('u_user').value, 
        "Parola": parseInt(document.getElementById('u_pass').value), 
        "Rol": document.getElementById('u_rol').value,
        "Creat": new Date().toLocaleDateString()
    };
    const { error } = id ? await supabaseClient.from('Utilizatori').update(row).eq('id', id) : await supabaseClient.from('Utilizatori').insert([row]);
    handleResponse(error, 'userModal', loadUsers);
}

function editUser(id) {
    const u = listaUsers.find(x => x.id == id);
    document.getElementById('u_id').value = u.id;
    document.getElementById('u_nume').value = u.Nume;
    document.getElementById('u_user').value = u["Email/User"];
    document.getElementById('u_pass').value = u.Parola;
    document.getElementById('u_rol').value = u.Rol;
    document.getElementById('userModal').style.display = 'block';
}

// --- UTILS GENERALE ---
function showPage(p) {
    document.querySelectorAll('.app-page').forEach(pg => pg.style.display = 'none');
    document.getElementById(p).style.display = 'block';
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    
    const btn = document.getElementById('btnUniversal');
    if(p === 'pageSantiere') { 
        document.getElementById('navSantiere').classList.add('active'); 
        btn.innerText = "+ Adaugă Lucrare"; btn.onclick = openAdd; load(); 
    }
    if(p === 'pageClienti') { 
        document.getElementById('navClienti').classList.add('active'); 
        btn.innerText = "+ Client Nou"; btn.onclick = openAddClient; loadClienti(); 
    }
    if(p === 'pageUtilizatori') { 
        document.getElementById('navUtilizatori').classList.add('active'); 
        btn.innerText = "+ User Nou"; btn.onclick = openAddUser; loadUsers(); 
    }
}

async function deleteItem(table, id, callback) {
    if(confirm("Sigur ștergi această înregistrare?")) {
        const { error } = await supabaseClient.from(table).delete().eq('id', id);
        if(!error) callback();
    }
}

function handleResponse(error, modalId, callback) {
    if (!error) {
        Swal.fire('Succes!', 'Datele au fost salvate.', 'success');
        closeM(modalId);
        if(callback) callback(); else load();
    } else { Swal.fire('Eroare', error.message, 'error'); }
}

function calculOre(s, e) {
    const diff = (new Date("1970-01-01 " + e) - new Date("1970-01-01 " + s)) / 1000 / 3600;
    return diff > 0 ? parseFloat(diff.toFixed(1)) : 8;
}

function openAdd() { document.getElementById('e_id').value = ''; document.getElementById('editModal').style.display = 'block'; }
function openEdit(id) {
    const r = allData.find(x => x[14] == id);
    document.getElementById('e_id').value = r[14];
    document.getElementById('e_client').value = r[0];
    document.getElementById('e_adr').value = r[1];
    document.getElementById('e_d1').value = r[2];
    document.getElementById('e_d2').value = r[2];
    document.getElementById('e_t1').value = r[4];
    document.getElementById('e_t2').value = r[5];
    document.getElementById('e_inc').value = r[6];
    document.getElementById('e_tarif').value = r[7];
    document.getElementById('e_msg').value = r[12];
    document.getElementById('editModal').style.display = 'block';
}

function openAddClient() { document.getElementById('c_id').value = ''; document.getElementById('clientModal').style.display = 'block'; }
function openAddUser() { document.getElementById('u_id').value = ''; document.getElementById('userModal').style.display = 'block'; }
function closeM(id) { document.getElementById(id).style.display = 'none'; }

function applyFilters() {
    const s = document.getElementById('search').value.toLowerCase();
    const d1 = document.getElementById('dateFrom').value;
    const d2 = document.getElementById('dateTo').value;
    const arc = document.getElementById('showArchived').checked;

    const filtered = allData.filter(r => {
        const matchesS = r[0].toLowerCase().includes(s) || r[1].toLowerCase().includes(s);
        const matchesA = arc ? true : !r[13];
        let matchesD = true;
        if (d1 && r[2]) matchesD = matchesD && (r[2] >= d1);
        if (d2 && r[2]) matchesD = matchesD && (r[2] <= d2);
        return matchesS && matchesA && matchesD;
    });
    render(filtered);
    updateStats(filtered);
}

function updateStats(data) {
    const ore = data.reduce((a,b) => a + (parseFloat(b[11])||0), 0);
    const inc = data.reduce((a,b) => a + (parseFloat(b[6])||0), 0);
    const rest = data.reduce((a,b) => a + (parseFloat(b[9])||0), 0);
    document.getElementById('statOre').innerText = ore.toFixed(1);
    document.getElementById('statInc').innerText = inc.toFixed(2) + " €";
    document.getElementById('statRest').innerText = rest.toFixed(2) + " €";
    document.getElementById('statNr').innerText = data.length;
}

function initializareUI() {
    document.getElementById('userBadge').style.display = 'block';
    document.getElementById('u_display_rol').innerText = currentUser.rol;
    document.getElementById('u_initials').innerText = currentUser.nume.substring(0,2).toUpperCase();
}

function resetareFiltreDate() { document.getElementById('dateFrom').value = ''; document.getElementById('dateTo').value = ''; applyFilters(); }
function logout() { localStorage.clear(); location.reload(); }

window.onload = () => {
    setInterval(() => { document.getElementById('liveClock').innerText = new Date().toLocaleString(); }, 1000);
    const saved = localStorage.getItem('santierUser');
    if(saved) {
        currentUser = JSON.parse(saved);
        document.getElementById('loginOverlay').style.display = 'none';
        initializareUI();
        load();
    }
    lucide.createIcons();
};
