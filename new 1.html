<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Infinity Floating Edition</title>
	<link rel="manifest" href="manifest1.json">
    
    <meta name="theme-color" content="#2563eb">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Caveat&family=JetBrains+Mono&display=swap" rel="stylesheet">
	<link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=W&background=2563eb&color=fff&size=180">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --accent: #2563eb;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: rgba(0, 0, 0, 0.05);
            --clock-text: #0f172a;
            --clock-script: #d4a757;
            --shadow-floating: 0 30px 60px -12px rgba(0, 0, 0, 0.25), 0 18px 36px -18px rgba(0, 0, 0, 0.3);
            --text-float-shadow: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.15));
        }

        [data-theme="dark"] {
            --bg: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --clock-text: #ffffff;
            --shadow-floating: 0 40px 80px -15px rgba(0, 0, 0, 0.6), 0 25px 40px -20px rgba(0, 0, 0, 0.5);
            --text-float-shadow: drop-shadow(0 20px 20px rgba(0, 0, 0, 0.8));
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.05) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            transition: background 0.4s ease;
        }

        #custom-cursor {
            width: 20px; height: 20px;
            background: var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        @keyframes breakAndFall {
            0% { transform: rotate(0deg) translateY(0); opacity: 1; }
            10% { transform: rotate(0deg) translateY(0); opacity: 1; }
            25% { transform: rotate(10deg); opacity: 1; }
            45% { transform: rotate(20deg) translateY(100vh); opacity: 0; }
            55%, 90% { transform: rotate(0deg) translateY(0); opacity: 0; }
            100% { transform: rotate(0deg) translateY(0); opacity: 1; }
        }

        @keyframes floatSubtitle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        header {
            position: fixed; top: 4rem; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 100; width: 100%;
            filter: var(--text-float-shadow);
        }
        
        h1 { 
            font-size: 6rem; font-weight: 900; 
            display: flex;
            justify-content: center;
            margin: 0;
            line-height: 0.9;
        }

        .work-part {
            background: linear-gradient(180deg, var(--accent), #1e3a8a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .space-part {
            display: inline-block;
            background: linear-gradient(180deg, var(--accent), #1e3a8a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            transform-origin: top left;
            animation: breakAndFall 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .subtitle { 
            font-size: 1.4rem; 
            color: var(--text-sub); 
            letter-spacing: 0.05em; /* Redus pentru lizibilitate mai bună la litere mici */
            display: block; 
            animation: floatSubtitle 4s ease-in-out infinite;
            /* ELIMINAT: text-transform: uppercase; */
        }

        .theme-switch-wrapper { position: fixed; top: 2rem; right: 2rem; z-index: 110; }
        .theme-switch { display: inline-block; width: 54px; height: 30px; position: relative; }
        .theme-switch input { display: none; }
        .slider {
            position: absolute; cursor: none; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1; border-radius: 34px; transition: 0.4s;
            box-shadow: var(--shadow-floating);
        }
        .slider:before {
            position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px;
            background-color: white; border-radius: 50%; transition: 0.4s;
        }
        input:checked + .slider { background-color: #34c759; }
        input:checked + .slider:before { transform: translateX(24px); }

        .workspace {
            position: relative; width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: flex-end; padding-right: 8%;
        }

        .scatter-container { position: absolute; top: 0; left: 0; width: 55%; height: 100%; pointer-events: none; }

        .card-scatter {
            position: absolute; pointer-events: auto;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.2rem 1.5rem;
            text-decoration: none; color: inherit;
            display: flex; align-items: center; gap: 15px;
            box-shadow: var(--shadow-floating);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .card-scatter:hover {
            transform: scale(1.15) rotate(0deg) !important;
            z-index: 50; border-color: var(--accent);
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.4);
        }

        .icon-box {
            width: 42px; height: 42px; background: rgba(37,99,235,0.08);
            border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--accent);
        }

        .clock-wrapper {
            position: relative; text-align: center; margin-top: 120px;
            filter: var(--text-float-shadow);
            animation: clockFloat 6s ease-in-out infinite;
            transform: rotate(-5deg); transition: all 0.5s ease;
        }
        @keyframes clockFloat {
            0%, 100% { transform: rotate(-5deg) translateY(0px); }
            50% { transform: rotate(-5deg) translateY(-12px); }
        }
        .clock-wrapper:hover { transform: rotate(0deg) scale(1.05); }

        .month-v { position: absolute; left: -60px; top: 20px; writing-mode: vertical-rl; transform: rotate(180deg); text-transform: uppercase; letter-spacing: 0.5em; font-size: 1.2rem; color: var(--clock-text); opacity: 0.8; }
        .day-big { font-size: 16rem; font-weight: 900; line-height: 0.8; color: var(--clock-text); letter-spacing: -0.05em; }
        .day-script { font-family: 'Caveat', cursive; font-size: 7rem; color: var(--clock-script); position: absolute; top: 48%; left: 50%; transform: translate(-35%, -10%) rotate(-6deg); }
        .time-digital { font-family: 'JetBrains Mono', monospace; font-size: 3.5rem; font-weight: 800; margin-top: 2rem; color: var(--clock-text); }

        .card-scatter:nth-child(1) { top: 25%; left: 8%; transform: rotate(-3deg); }
        .card-scatter:nth-child(2) { top: 38%; left: 28%; transform: rotate(4deg); }
        .card-scatter:nth-child(3) { top: 58%; left: 6%; transform: rotate(-2deg); }
        .card-scatter:nth-child(4) { top: 72%; left: 24%; transform: rotate(3deg); }
        .card-scatter:nth-child(5) { top: 82%; left: 10%; transform: rotate(-5deg); }
        .card-scatter:nth-child(6) { top: 50%; left: 20%; transform: rotate(2deg); }

        footer {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            font-size: 1.1rem; color: var(--text-sub); opacity: 0.7;
            font-family: 'Caveat', cursive; white-space: nowrap;
        }
        #typing-cursor { display: inline-block; width: 2px; height: 1.1em; background-color: var(--text-sub); animation: blink 0.7s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <header>
        <h1>
            <span class="work-part">WORK</span>
            <span class="space-part">SPACE</span>
        </h1>
        <span class="subtitle">Platformă de management operațional</span>
    </header>

    <div class="theme-switch-wrapper">
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="workspace">
        <div class="scatter-container">
            <a href="#" class="card-scatter">
                <div class="icon-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/></svg></div>
                <h3>Control Financiar</h3>
            </a>
            <a href="#" class="card-scatter">
                <div class="icon-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c0-2.8 2.2-5 5-5s5 2.2 5 5v4c0 2.8-2.2 5-5 5s-5-2.2-5-5Z"/><path d="M5 13a3 3 0 0 1 3-3"/><path d="M14 11h.01"/><path d="M17 14h.01"/><path d="M20 11h.01"/><path d="M17 8h.01"/></svg></div>
                <h3>Pontaje Muncă</h3>
            </a>
            <a href="#" class="card-scatter">
                <div class="icon-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a8 8 0 0 0-16 0v2Z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/></svg></div>
                <h3>Santiere VerTech</h3>
            </a>
            <a href="#" class="card-scatter">
                <div class="icon-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><path d="M7 15h.01M11 15h2"/></svg></div>
                <h3>Plăți Lunare</h3>
            </a>
            <a href="#" class="card-scatter">
                <div class="icon-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg></div>
                <h3>Raport Zilnic</h3>
            </a>
            <a href="#" class="card-scatter">
                <div class="icon-box"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
                <h3>Consum Energie</h3>
            </a>
        </div>

        <div class="clock-wrapper">
            <div class="month-v" id="month">APRIL</div>
            <div class="day-big" id="day-num">25</div>
            <div class="day-script" id="day-name">Saturday</div>
            <div class="time-digital" id="time">10:49 AM</div>
        </div>
    </div>

    <footer id="typing-footer">
        <span id="typing-text"></span><span id="typing-cursor"></span>
    </footer>

<script>
    const linkuriCarduri = {
        financiar: "https://script.google.com/macros/s/AKfycbwlX_U4zfQG_GjPRJeCPMiM70Zv4ww0lvOBDThB2Lbs4pr4XwRzwqnl4JZo8Tk33awmxg/exec", 
        pontaj: "https://script.google.com/macros/s/AKfycbwxAwOveTp_9fbv2UHxt97zyb4QEZFl84-T6Gyp1mQN757Achwy6rJT3mKmBnW7n8zyBQ/exec",
        santiere: "https://script.google.com/macros/s/AKfycbwmOvPxmxGpbk_9pM61uEuQ3jm5UEqD9OIISsNEZdLUKiipFA45R5RRlB2qetSLV5SkNA/exec",
        plati: "https://luchianul.github.io/plati/",
        raport: "https://script.google.com/macros/s/AKfycbxyFoBNUibpzOcY57c1ByRH1B9BVEHxs0ksC3vPA7S17r2472oVxUu-zK-FPh181R2v/exec",
        energie: "https://script.google.com/macros/s/AKfycbyBqtNEXb_FxZTbtFJq9vvouG4YpE0wBUxZVuMiBMA6WykdTJ5m0kMhpticHjPTERI3dA/exec"
    };

    const cards = document.querySelectorAll('.card-scatter');
    const keys = Object.keys(linkuriCarduri);
    cards.forEach((card, index) => {
        if(keys[index]) {
            card.href = linkuriCarduri[keys[index]];
            card.target = "_blank";
            card.rel = "noopener noreferrer";
        }
    });

    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    const hoverSound = new Audio('https://www.gstatic.com/chat/sounds/incoming_message.mp3');
    hoverSound.volume = 0.6; 
    cards.forEach(card => {
        card.addEventListener('mouseenter', () => {
            hoverSound.currentTime = 0;
            hoverSound.play().catch(e => {}); 
        });
    });

    function updateClock() {
        const now = new Date();
        const months = ["IANUARIE", "FEBRUARIE", "MARTIE", "APRILIE", "MAI", "IUNIE", "IULIE", "AUGUST", "SEPTEMBRIE", "OCTOMBRIE", "NOIEMBRIE", "DECEMBRIE"];
        const days = ["Duminică", "Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă"];
        
        document.getElementById('month').textContent = months[now.getMonth()];
        document.getElementById('day-num').textContent = now.getDate();
        document.getElementById('day-name').textContent = days[now.getDay()];
        
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById('time').textContent = hours + ':' + minutes + ' ' + ampm;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const toggle = document.getElementById('theme-toggle');
    if (toggle) {
        toggle.addEventListener('change', () => {
            const theme = toggle.checked ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });
        if(localStorage.getItem('theme') === 'dark') {
            toggle.checked = true;
            document.body.setAttribute('data-theme', 'dark');
        }
    }

    const footerText = "Copyright © 2026 powered by VerTech";
    const typingTextElement = document.getElementById('typing-text');
    let charIndex = 0;
    let isDeleting = false;

    function type() {
        if (!typingTextElement) return;
        if (!isDeleting) {
            typingTextElement.textContent = footerText.substring(0, charIndex + 1);
            charIndex++;
            if (charIndex === footerText.length) {
                isDeleting = true;
                setTimeout(type, 3000);
                return;
            }
        } else {
            typingTextElement.textContent = footerText.substring(0, charIndex - 1);
            charIndex--;
            if (charIndex === 0) {
                isDeleting = false;
                setTimeout(type, 500);
                return;
            }
        }
        setTimeout(type, isDeleting ? 30 : 70);
    }
    document.addEventListener('DOMContentLoaded', () => setTimeout(type, 1000));
</script>
</body>
</html>
